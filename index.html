<style>
/* Visualizador de Hugo — pelado hasta el hueso */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --tinta: #080604;
  --panel: #131722;
  --borde: #2a3140;
  --oro: #c2a15a;
  --texto: #e8eaed;
  --tenue: #9aa0ac;
}
html { background: var(--tinta); }
body {
  background: var(--tinta);
  color: var(--texto);
  font-family: 'Lora', Georgia, serif;
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.2rem 1rem 3rem;
}
h1, h2, h3 { font-family: 'Cinzel', 'Lora', serif; font-weight: 600; }
a { color: var(--oro); text-decoration: none; }
a:hover { text-decoration: underline; }

.cabecera { border-bottom: 1px solid var(--oro); padding-bottom: .6rem; margin-bottom: 1rem; }
.cabecera h1 { font-size: 1.35rem; letter-spacing: .04em; }
#portada-observatorio { position:relative; margin:.5rem 0 1.6rem; }
#portada-observatorio[hidden] { display:none; }
#portada-observatorio img { display:block; width:100%; height:auto; aspect-ratio: 1440 / 810; }
.portada-titulo { position:absolute; top:33%; left:3.5%; font-family:'Lora',Georgia,serif; font-size:clamp(1rem,2.8vw,2rem); line-height:1.45; text-transform:uppercase; }
.portada-titulo span { color:var(--oro); }
@media(max-width:560px) { .cabecera h1 { font-size:1rem; } .avatar { flex-shrink:0; } #portada-observatorio { margin-bottom:1rem; } .portada-titulo { font-size:clamp(.8rem,3.6vw,1.25rem); } }
.cabecera p { color: var(--tenue); font-size: .85rem; margin-top: .15rem; }

#buscar, #buscar-global {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--borde);
  color: var(--texto);
  font-family: inherit;
  font-size: .9rem;
  padding: .4rem .6rem;
  border-radius: 4px;
  max-width: 17rem;
  margin-bottom: .9rem;
}
#buscar:focus, #buscar-global:focus { outline: 1px solid var(--oro); }

#busqueda-global { margin:1rem 0; }
#busqueda-global[hidden], #resultados-global[hidden] { display:none; }
#busqueda-global label { display:block; font-size:.85rem; color:var(--tenue); margin-bottom:.4rem; }
#buscar-global { max-width:26rem; margin-bottom:.35rem; }
#cuenta-global { color:var(--tenue); font-size:.8rem; margin:.25rem 0; }
#resultados-global .activo-fila { flex-wrap:wrap; }
#resultados-global .tipo { font-size:.75rem; }
@media(max-width:560px) {
  #resultados-global .nom { white-space:normal; }
  #resultados-global .tipo { flex-basis:100%; margin-left:3.85rem; }
}
.nodo { border-bottom: 1px solid var(--borde); }
.nodo > .nodo-tit {
  display: flex; align-items: baseline; gap: .6rem;
  width: 100%; background: none; border: none; color: var(--texto);
  font-family: 'Cinzel', 'Lora', serif; font-size: 1.05rem;
  padding: .8rem .2rem; cursor: pointer; text-align: left;
}
.nodo > .nodo-tit .cuenta { color: var(--tenue); font-size: .8rem; font-family: 'Lora', serif; margin-left: auto; }
.nodo > .nodo-tit::before { content: '▸ '; color: var(--oro); }
.nodo.abierto > .nodo-tit::before { content: '▾ '; }
.nodo .hijos { display: none; padding: 0 0 .6rem 1.2rem; }
.nodo.abierto > .hijos { display: block; }

.campana { padding: .4rem 0 2rem; }
.camp-tit { font-family: 'Cinzel', 'Lora', serif; font-weight: 400; color: var(--oro); font-size: 1.1rem; margin: .8rem 0 .2rem; }
.camp-tit-enlace { color: inherit; }
.camp-tit-enlace:hover { text-decoration: underline; }
.camp-fila { cursor: pointer; flex-wrap: wrap; }
.activo-fila.camp-fila .tipo { margin-left: 0; color: var(--tenue); font-size: .72rem; line-height: 1.15; max-width: 7.5em; white-space: nowrap; text-align: right; flex: 0 0 auto; }
.camp-fila .cap { flex: 0 0 auto; }
.camp-fila { align-items: center; flex-wrap: nowrap; }
.camp-fila .nom { min-width: 4em; }
.camp-fila .cap { margin-left: auto; }
.camp-sub { color: var(--tenue); font-size: .85rem; margin: .1rem 0 .6rem; }
.camp-caja { margin: .6rem 0 1rem; }
.camp-svg { width: 100%; height: auto; display: block; background: var(--panel); border: 1px solid var(--borde); border-radius: 4px; }
.camp-rej { stroke: var(--borde); stroke-width: 1; }
.camp-eje { fill: var(--tenue); font-size: 11px; }
.camp-lin { fill: none; stroke: var(--tenue); stroke-opacity: .12; stroke-width: 1; pointer-events: none; }
.camp-lin.camp-sel { stroke: #fff3cf; stroke-opacity: 1; stroke-width: 2.6; }
.camp-hit { fill: none; stroke: transparent; stroke-width: 7; cursor: pointer; }
.camp-hit:hover { stroke: rgba(255,243,207,.35); }
.camp-ejes, .camp-ley { color: var(--tenue); font-size: .8rem; margin: .35rem 0 0; }
.camp-uno { stroke: var(--texto); stroke-opacity: .6; stroke-dasharray: 5 4; }
.camp-curva { fill: none; stroke-width: 2; }
.camp-curva.camp-pot, .camp-punto.camp-pot { stroke: var(--oro); }
.camp-curva.camp-con, .camp-punto.camp-con { stroke: #7fb2e5; }
.camp-punto { stroke-width: 0; }
.camp-punto.camp-pot { fill: var(--oro); } .camp-punto.camp-con { fill: #7fb2e5; }
.camp-k { display: inline-block; width: 1.1em; height: 3px; vertical-align: middle; margin: 0 .2em 0 .5em; }
.camp-k.camp-pot { background: var(--oro); } .camp-k.camp-con { background: #7fb2e5; } .camp-uno-k { background: var(--texto); opacity: .6; }
.camp-cuad-pto { fill: var(--tenue); fill-opacity: .6; cursor: pointer; }
.camp-g-premium { fill: #6fbf8a; fill-opacity: .95; background: #6fbf8a; } /* verde = amarillo (potencia) + azul (constancia); usuario, Slack 1795610271.848919 */
.camp-g-potentes { fill: var(--oro); fill-opacity: .8; background: var(--oro); }
.camp-g-constantes { fill: #7fb2e5; fill-opacity: .8; background: #7fb2e5; }
.camp-g-rezagados { fill: #8d8a99; fill-opacity: .6; background: #8d8a99; }
.camp-cuad-ley { display: flex; flex-wrap: wrap; gap: .3rem 1rem; }
.camp-cuad-k { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin-right: .35em; }
.camp-cuad-envol { position: relative; }
.camp-cuad-cab { min-height: 4.4rem; margin-bottom: .4rem; display: flex; flex-direction: column; justify-content: flex-end; }
.camp-cuad-nombre { font-size: 1.7rem; margin: 0; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.camp-cuad-dato { margin: .15rem 0 0; }
.camp-cuad-juntos { position: absolute; z-index: 5; width: max-content; max-width: min(92%, 22rem); max-height: 15rem; overflow: auto; padding: .5rem; background: var(--panel); border: 1px solid var(--oro); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.6); display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.camp-cuad-juntos[hidden] { display: none; }
.camp-cuad-juntos p { width: 100%; margin: 0; color: var(--tenue); font-size: .85rem; }
.camp-cuad-op { font: inherit; font-size: .85rem; padding: .35rem .6rem; min-height: 2.2rem; border-radius: 6px; border: 1px solid var(--oro); background: transparent; color: var(--texto); cursor: pointer; }
.camp-cuad-pto:hover { stroke: var(--texto); stroke-width: 1.5; }
.camp-cuad-pto.camp-sel { fill-opacity: 1; stroke: #fff3cf; stroke-width: 2; }
.camp-cuad-rot { fill: var(--oro); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; opacity: .9; pointer-events: none; }
.camp-cuad-rot.camp-rot-premium { fill: #6fbf8a; } .camp-cuad-rot.camp-rot-potentes { fill: var(--oro); } .camp-cuad-rot.camp-rot-constantes { fill: #7fb2e5; } .camp-cuad-rot.camp-rot-rezagados { fill: #8d8a99; }

.camp-campo-fuera { fill: rgba(111,191,138,.07); }
.camp-campo-dentro { fill: rgba(255,255,255,.04); }
.camp-campo-cerca { fill: none; stroke: #6fbf8a; stroke-width: 2; }
.camp-campo-cerca-n { fill: #6fbf8a; font-weight: 700; }
.camp-campo-foul { stroke-width: 2; opacity: .85; }
.camp-campo-foul.camp-eje-pot { stroke: var(--oro); } .camp-campo-foul.camp-eje-con { stroke: #7fb2e5; }
.camp-campo-home { fill: var(--texto); }
.camp-campo-tray { fill: none; stroke: #fff3cf; stroke-width: 2; stroke-linecap: round; opacity: .9; pointer-events: none; }
.camp-campo-bola { fill: #fff; stroke: #c0392b; stroke-width: 1.5; pointer-events: none; }
.camp-cuad-eje { fill: var(--tenue); font-size: 16px; }
.camp-cuad-eje.camp-eje-pot { fill: var(--oro); } .camp-cuad-eje.camp-eje-con { fill: #7fb2e5; } /* mismos colores que las curvas: Potencia amarillo, Constancia azul (usuario, Slack 1795610220.251959) */
.camp-cuad-cod { fill: var(--texto); font-size: 19px; font-weight: 700; pointer-events: none; }
.camp-lista .cap { white-space: nowrap; }
.camp-lista .camp-fila .tipo { width: 5.6em; max-width: none; }
.camp-lista .camp-fila .cap { width: 4.8em; text-align: right; }
.camp-cab { cursor: default; color: var(--tenue); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid rgba(194,161,90,.25); }
.camp-cab .tipo, .camp-cab .cap { margin-right: -.06em; }
.camp-cab span { color: var(--tenue) !important; font-size: .72rem !important; font-weight: 400 !important; }
.camp-n-premium { color: #6fbf8a !important; }
.camp-n-potentes { color: var(--oro) !important; }
.camp-n-constantes { color: #7fb2e5 !important; }
.camp-n-rezagados { color: #8d8a99 !important; }

.activo-fila {
  display: flex; gap: .6rem; align-items: baseline;
  padding: .34rem .2rem; border-radius: 3px; color: var(--texto);
}
a.activo-fila:hover { background: var(--panel); text-decoration: none; }
.activo-fila.resaltado { background: rgba(194, 161, 90, .14); outline: 1px solid rgba(194, 161, 90, .45); outline-offset: -1px; border-radius: 3px; }
.activo-fila .cod { font-weight: 700; min-width: 7.5em; }
.activo-fila .nom { color: var(--tenue); font-size: .9rem; }
.activo-fila .cap { color: var(--oro); font-size: .82rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.activo-fila .tipo { margin-left: auto; color: var(--oro); font-size: .75rem; white-space: nowrap; }
.vacio { color: var(--tenue); padding: .5rem .2rem; font-style: italic; }

.volver { display: inline-block; margin-bottom: .8rem; font-size: .9rem; }
.ficha { border-bottom: 1px solid var(--oro); padding-bottom: .7rem; margin-bottom: 1rem; }
.ficha h1 { font-size: 1.5rem; display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.ficha h1 .nom { font-family: 'Lora', serif; font-size: 1rem; color: var(--tenue); font-weight: 400; }
.ficha .meta { color: var(--tenue); font-size: .88rem; margin-top: .3rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.ficha .meta .tipo { color: var(--oro); }
.ficha .lectura { color: var(--tenue); font-size: .9rem; margin-top: .15rem; font-style: italic; }

.lienzo-caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 4px; padding: .4rem; overflow-x: auto; }
canvas { display: block; width: 100%; height: auto; margin: 0 auto; }
.pie-grafica { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: .6rem; flex-wrap: wrap; }
.controles-grafica { display: flex; gap: .5rem; flex-wrap: wrap; }
.pie-grafica .nota { color: var(--tenue); font-size: .8rem; font-style: italic; }
/* Barra móvil 24 h (stocks): al pie del iceberg, misma orientación que las minis de la portada
   (rojo a la izquierda, verde a la derecha) y mismos colores sólidos de la casa. */
.barra-movil { margin-top: .6rem; }
.barra-movil-sec { margin-top: 1.15rem; }
.barra-tabla td { white-space: normal !important; }
.barra-movil-titulo { font-size: .85rem; color: var(--texto); margin-bottom: .25rem; }
.barra-movil-graf { display: flex; height: .6rem; border-radius: 2px; overflow: hidden; background: var(--borde); }
.barra-movil-graf span { display: block; height: 100%; }
.barras-indicadores .barra-movil-graf span + span { border-left: 2px solid #000; box-sizing: border-box; }
.barra-movil-nums { font-size: .85rem; margin-top: .3rem; font-variant-numeric: tabular-nums; }
.barra-movil-periodo, .barra-movil-sec .barra-movil-nums { color: var(--tenue); font-size: .8rem; }
.barra-movil-nota { color: var(--tenue); font-size: .8rem; font-style: italic; margin-top: .15rem; }
.barra-movil-enlace { display: inline-block; font-size: .85rem; margin-top: .2rem; }
button.boton {
  background: none; border: 1px solid var(--oro); color: var(--oro);
  font-family: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 3px; cursor: pointer;
}
button.boton:hover { background: var(--oro); color: var(--tinta); }
.estado { color: var(--tenue); padding: 2rem 0; text-align: center; font-style: italic; }

.tit-link { display: flex; align-items: center; gap: .65rem; color: inherit; }
a.tit-link:hover { text-decoration: none; }
.avatar { width: 44px; height: 44px; border-radius: 5px; border: 1px solid var(--borde); display: block; }

.activo-fila .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 0; }
.caps { margin-left: auto; display: flex; gap: 1rem; flex: none; }
.cap-sub { min-width: 5.2em; text-align: right; color: var(--tenue); font-size: .82rem; font-variant-numeric: tabular-nums; }
.caps .cap { margin-left: 0; min-width: 3.8em; text-align: right; }
.fila-cab { display: flex; align-items: baseline; padding: .1rem .2rem .3rem; border-bottom: 1px solid var(--borde); margin-bottom: .2rem; }
.lab-cols { margin-left: auto; display: flex; gap: 1rem; flex: none; }
.lab-cols span { font-size: .72rem; letter-spacing: .05em; }
.lab-sub { min-width: 5.2em; text-align: right; color: var(--tenue); }
.lab-cap { min-width: 3.8em; text-align: right; color: var(--oro); }

@media (max-width: 560px) {
  .activo-fila { gap: .45rem; }
  .activo-fila .cod { min-width: 3.4em; }
  .caps { gap: .6rem; }
  .cap-sub { min-width: 4.6em; }
  .lab-cols { gap: .6rem; }
  .lab-sub { min-width: 4.6em; }
}
.cap-fecha { color: var(--tenue); font-size: .68rem; }

.vistas, .mercados { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
.mercados { margin-bottom:.55rem; }
.vistas a[hidden], .mercados a[hidden], .vistas[hidden], .mercados[hidden], #buscar[hidden], #rotulo-mercado[hidden] { display:none; }
/* Todos los botones vuelven al dorado original (22-nov-2026). */
.mercados a, .vistas a { border:1px solid var(--oro); border-radius:3px; font-family:'Cinzel','Lora',serif; font-size:1.05rem; padding:.5rem .95rem; color:var(--oro); }
.mercados a.actual, .vistas a.actual { background:var(--oro); color:var(--tinta); }
.mercados a:hover, .vistas a:hover { text-decoration:none; }
#rotulo-mercado { font-family:'Cinzel','Lora',serif; font-weight:600; font-size:1.15rem; letter-spacing:.06em; color:var(--oro); margin:.1rem 0 .6rem; }
.rachas-nota { color:var(--tenue); font-size:.85rem; line-height:1.6; margin:.65rem 0; }
.rachas-controles { display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; margin:1rem 0; }
.rachas-controles #buscar { margin-bottom:0; }
.rachas-controles select { font:inherit; color:var(--texto); background:var(--panel); border:1px solid var(--borde); border-radius:3px; padding:.4rem; max-width:100%; }
.rachas-controles label { font-size:.85rem; display:flex; align-items:center; gap:.4rem; }
.rachas-controles button:disabled { opacity:.5; cursor:wait; }
.rachas-reglas, .rachas-incidencias { font-size:.85rem; line-height:1.6; margin:1rem 0; color:var(--tenue); }
.rachas-cargando { font-size:1.05rem; color:var(--texto); background:var(--panel); border:1px solid var(--borde); border-radius:3px; padding:.9rem 1rem; margin:1rem 0; }
.rachas-cargando-cifra { color:var(--oro); font-size:1.4rem; font-variant-numeric:tabular-nums; }
.rachas-cargando-barra { display:block; height:.35rem; background:var(--borde); border-radius:2px; margin-top:.6rem; overflow:hidden; }
.rachas-cargando-barra span { display:block; height:100%; width:0; background:var(--oro); transition:width .2s; }
.rachas-reglas summary, .rachas-incidencias summary { color:var(--oro); cursor:pointer; }
.rachas-reglas p { margin:.6rem 0; }
.rachas-incidencias ul { padding-left:1.4rem; }
.rachas-tabla-caja { overflow-x:auto; }
.rachas-tabla { border-collapse:collapse; width:100%; font-size:.9rem; font-variant-numeric:tabular-nums; }
.rachas-tabla th { color:var(--tenue); font-size:.78rem; font-weight:normal; text-align:right; white-space:nowrap; }
.rachas-tabla .col-activo { text-align:left; }
.rachas-tabla td, .rachas-tabla th { border-bottom:1px solid var(--borde); padding:.7rem .45rem; }
.rachas-tabla td:not(.col-activo) { text-align:right; white-space:nowrap; }
.rachas-tabla th:not(.col-activo), .rachas-tabla td:not(.col-activo) { width:1%; } /* columnas numéricas y el puesto a su contenido: sin hueco entre Rango diario y Racha; el ancho sobrante es del activo */
.rachas-tabla .rachas-enlace { display:inline; color:var(--oro); font-weight:bold; padding:0; }
.rachas-nombre, .rachas-limite { display:block; font-size:.72rem; color:var(--tenue); margin-top:.25rem; white-space:normal; }
.rachas-limite { overflow-wrap:anywhere; } /* la nota de la racha no ensancha la columna */
.negativo { color:#ec9698; } .positivo { color:#78caa4; } .igual { color:#9aa0ac; }
@media(max-width:560px) { .rachas-tabla { font-size:.79rem; } .rachas-tabla td, .rachas-tabla th { padding:.6rem .25rem; } .rachas-tabla th { font-size:.66rem; } .rachas-nombre { max-width:6rem; } .rachas-controles { gap:.5rem; } }
/* Registro intradiario y superficie: conserva los colores y la tipografía de Hugo. */
.superficie-reloj { margin: .8rem 0 1rem; border-left: 2px solid var(--oro); padding-left: .8rem; }
.superficie-reloj-titulo { color: var(--oro); font-size: .8rem; margin: 0 0 .3rem; }
.superficie-reloj-hora { color: var(--texto); font-size: .9rem; line-height: 1.6; margin: 0; }
.superficie-reloj-hora time { font-variant-numeric: tabular-nums; white-space: nowrap; }
.superficie-caja { margin: 1rem 0; border-top: 1px solid var(--borde); padding-top: .8rem; }
.superficie-controles { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: .75rem 0; font-size: .82rem; color: var(--tenue); }
.superficie-controles label { display: flex; align-items: center; gap: .4rem; }
.superficie-controles select, .superficie-controles button { font: inherit; color: var(--texto); background: var(--panel); border: 1px solid var(--borde); border-radius: 3px; padding: .35rem .5rem; }
.superficie-controles button { cursor: pointer; color: var(--oro); }
.superficie-controles input { width: 95px; accent-color: var(--oro); }
.superficie-pasos { display: inline-flex; align-items: stretch; gap: .25rem; }
.superficie-pasos select { min-width: 5.3rem; }
.superficie-pasos .superficie-flecha { min-width: 2.2rem; min-height: 2.2rem; padding: .25rem; font: 1.1rem Arial, sans-serif; }
.superficie-flecha:disabled { opacity: .3; cursor: default; }
@media (max-width: 600px) {
  .superficie-controles:has(.superficie-pasos) { gap: .6rem; }
  .superficie-controles label:has(.superficie-pasos) { flex: 1 1 100%; justify-content: space-between; }
  .superficie-pasos .superficie-flecha { min-width: 2.5rem; min-height: 2.5rem; }
  .superficie-pasos select { width: 7.5rem; }
}
.superficie-canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
.superficie-canvas:active { cursor: grabbing; }
.superficie-pasos button.hundido { background: var(--borde); color: var(--texto); box-shadow: inset 0 2px 4px rgba(0,0,0,.6); }

<script type="module">
import { parentesisLectura } from './app/modulos/lectura-latina.mjs?v=1';

import { COLORES_LECTURA, LEYENDA_LECTURA, claseMovimiento, separarConteos, cifrasConteos, separarSerieIceberg } from './app/modulos/colores-lectura.mjs?v=2';
import { montarRachas, ventanaDelDia } from './visor-rachas.mjs?v=10'; // la versión en la URL fuerza la copia nueva en cada publicación (Pages cachea 10 min)
import { montarSuperficie, montarRelojObservatorio } from './visor-superficie.mjs?v=27';
import { leerDia, leerIndice, rutaDia, diaUTC, contextualizarBarra, lecturasConFrontera, diaVisible } from './app/modulos/intradia-datos.mjs';
/* Visualizador de Hugo: árbol de activos + radiografía trazada en vivo desde los registros. */
'use strict';

const RAW = 'https://raw.githubusercontent.com/osmancitov/hugo/main/registros/velas-24h';
const RAW_IND = 'https://raw.githubusercontent.com/osmancitov/hugo/main/registros/alternative-fear-greed';
// Piso del registro (decisión del usuario, 18-nov-2026): el graficador nunca pide meses
// anteriores a agosto de 2026, aunque un catálogo futuro los anuncie por error.
const PISO_VISOR = '2608';
const DIA_MS = 86400000;
const PISO_VISOR_TS = Date.UTC(2026, 7, 1);
const aammddUTC = (ts) => new Date(ts).toISOString().slice(2, 10).replace(/-/g, '');
const MESES_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MESES_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const BG = '#131722', BLUE = '#5a92d6', TICK = '#c9ccd3';
const GRID_D = '#212835', GRID_15 = '#313b50', GRID_1 = '#3d4759', ZERO = '#8b93a1';
const GREEN = 'rgba(37,133,92,0.5)', RED = 'rgba(183,61,64,0.5)';
const GREEN_S = 'rgb(37,133,92)', RED_S = 'rgb(183,61,64)';
const MARCO = '#3d4759';
const FUENTE = '"DejaVu Sans","Noto Sans CJK SC","Noto Sans CJK TC","WenQuanYi Zen Hei",sans-serif';

const LW = 1516, LH = 758, ML = 80, MR = 27, MT = 57, MB = 36;
const PW = LW - ML - MR, PH = LH - MT - MB;

const $ = (sel) => document.querySelector(sel);
const app = $('#app');
const elBuscar = $('#buscar'); // pieza única: se reubica en cada vista, nunca se duplica

// Lugar de la lista guardado al entrar en un activo, para que «volver» regrese ahí.
let estadoLista = null;
let origenLista = '#/stock';
let actualizarRachas = () => {};
app.addEventListener('click', (ev) => {
  const desdeTabla = ev.target.closest('a.barra-activo-enlace');

});

/* ---------- catálogo ---------- */
// Catálogo vivo: la sincronización publica registros/catalogo/<mercado> con todo lo que el visor
// necesita de cada activo (código, meses del registro, nombre, tipo, capitalización, ficha EDGAR,
// web oficial y si lleva fichas externas). Es el único origen: el visor no guarda listas propias.
// Si el servidor raw no responde, se lee la copia que publica el propio sitio.
const RAW_CAT = 'https://raw.githubusercontent.com/osmancitov/hugo/main/registros/catalogo';
async function leerCatalogoMercado(base, m) {
  const r = await fetch(`${base}/${m}`, { cache: 'no-cache' });
  if (!r.ok) throw new Error(String(r.status));
  const j = await r.json();
  if (!j || j.mercado !== m || !Array.isArray(j.activos)) throw new Error('forma');
  return j.activos.filter((e) => e && typeof e.codigo === 'string' && Array.isArray(e.meses));
}
async function cargarCatalogoPublicado() {
  const pares = await Promise.all(['stock', 'cripto'].map(async (m) => {
    try { return [m, await leerCatalogoMercado(RAW_CAT, m)]; }
    catch { return [m, await leerCatalogoMercado('registros/catalogo', m)]; }
  }));
  return Object.fromEntries(pares);
}
const CATALOGO_VIVO = await cargarCatalogoPublicado();
const TODOS = [];
const CRIPTOS = CATALOGO_VIVO.cripto.map((e) => ({ ...e, clase: 'cripto' })).sort((a, b) => (b.cap || 0) - (a.cap || 0));
const STOCKS = CATALOGO_VIVO.stock.map((e) => ({ ...e, clase: 'stock' }));
for (const e of CRIPTOS) TODOS.push(e);
for (const e of STOCKS) TODOS.push(e);
// Fichas de Stock Analysis y TipRanks: solo para los activos que el catálogo marca con ficha (destino comprobado).
// Empresas: /stocks/<ticker>/ y /stocks/<ticker>; fondos: /etf/<ticker>/ y /etf/<ticker>. BRKB se escribe brk.b en ambos sitios.
// Gráficas externas (decisión del usuario, 22-nov-2026): cada stock enlaza su gráfica en
// TradingView con su ticker bursátil (BRKB se escribe BRK.B; TradingView resuelve la plaza) y en
// Binance con su par bStock CODIGO + B + USDT, el mismo que registra Hugo.
// La web oficial (solo empresas; los fondos no llevan enlace Oficial) sale del campo web del catálogo.
function fichasExternas(e) {
  const enlaces = [];
  if (e.ficha) {
    const t = e.codigo === 'BRKB' ? 'brk.b' : e.codigo.toLowerCase();
    const ruta = e.tipo === 'empresa' ? 'stocks' : 'etf';
    enlaces.push(['Stock Analysis ↗', `https://stockanalysis.com/${ruta}/${t}/`], ['TipRanks ↗', `https://www.tipranks.com/${ruta}/${t}`]);
  }
  enlaces.push(['TradingView ↗', `https://www.tradingview.com/chart/?symbol=${e.codigo === 'BRKB' ? 'BRK.B' : e.codigo}`],
    ['Binance ↗', `https://www.binance.com/trade/${e.codigo}B_USDT`]);
  return enlaces;
}
const EMPRESAS = STOCKS.filter((e) => e.tipo === 'empresa').sort((a, b) => (b.cap || 0) - (a.cap || 0));
const FONDOS = STOCKS.filter((e) => e.tipo !== 'empresa').sort((a, b) => (b.cap || 0) - (a.cap || 0));
// Indicadores (19-nov-2026): series diarias, fuera del catálogo de activos. No entran en
// TODOS porque las rachas y las radiografías solo saben de velas; el buscador los suma aparte.
// Ventana uniforme: desde el piso del registro (1-ago-2026). Sin relleno: un día sin lectura
// (fin de semana, festivo bursátil) simplemente no tiene punto (decisión del usuario, 19-nov-2026).
const BANDAS_MIEDO = (b) => [
  [b[3] + 0.5, 100, 'rgba(37,133,92,0.30)', 'Codicia extrema'],
  [b[2] + 0.5, b[3] + 0.5, 'rgba(37,133,92,0.14)', 'Codicia'],
  [b[1] + 0.5, b[2] + 0.5, 'rgba(139,147,161,0.16)', 'Neutral'],
  [b[0] + 0.5, b[1] + 0.5, 'rgba(183,61,64,0.14)', 'Miedo'],
  [0, b[0] + 0.5, 'rgba(183,61,64,0.30)', 'Miedo extremo'],
];
const clasifMiedo = (b) => (v) => v <= b[0] ? 'Miedo extremo' : v <= b[1] ? 'Miedo' : v <= b[2] ? 'Neutral' : v <= b[3] ? 'Codicia' : 'Codicia extrema';
const INDICADORES = [
  // Bolsa EE. UU. según FearGreedChart (VIX, momentum S&P 500, put/call, refugio y crédito).
  // Sus zonas oficiales son 0-20/21-40/41-60/61-80/81-100. Solo días de sesión: el fin de
  // semana y los festivos bursátiles no tienen lectura y quedan como hueco, no se rellenan.
  { codigo: 'feargreedchart-bolsa', tipo: 'índice', indicador: true, mercado: 'stock',
    fuente: 'FearGreedChart.com', fuenteUrl: 'https://feargreedchart.com/',
    bandas: BANDAS_MIEDO([20, 40, 60, 80]), clasif: clasifMiedo([20, 40, 60, 80]),
    notaDias: 'solo días con sesión bursátil; un día sin sesión no tiene lectura' },
  { codigo: 'alternative-fear-greed', tipo: 'índice', indicador: true, mercado: 'cripto',
    fuente: 'Fear & Greed Index de Alternative.me',
    bandas: BANDAS_MIEDO([24, 44, 55, 74]), clasif: clasifMiedo([24, 44, 55, 74]) },
  // Iceberg: el primer indicador propio (decisión del usuario, 20-nov-2026): por día cerrado
  // en UTC, cuántos activos de su mercado cerraron en alza (verde, sobre el cero) y cuántos a
  // la baja (rojo), con igualdad separada en gris al presentar. Sin bandas ni escala 0-100: son conteos del registro. Uno por
  // mercado (decisión del usuario, 20-nov-2026: experiencia separada por mercado); dentro de su
  // espacio se llama simplemente «Iceberg». La serie sale del pre-cálculo diario de Hugo
  // (registros/pre-calculado/<mercado>/iceberg-90d/, ventana de 90 días), no de un recorrido del visor.
  { codigo: 'iceberg-stock', tipo: 'conteo diario', indicador: true, iceberg: true, mercado: 'stock',
    fuente: 'Observatorio Bursátil, sobre los registros publicados',
    notaDias: 'cuenta los stocks con vela cerrada ese día' },
  { codigo: 'iceberg-cripto', tipo: 'conteo diario', indicador: true, iceberg: true, mercado: 'cripto',
    fuente: 'Observatorio Bursátil, sobre los registros publicados',
    notaDias: 'cuenta las cripto con vela cerrada ese día' },
];

// Rótulos de los indicadores: UNA sola definición en el repositorio
// (app/modulos/indicadores-rotulos.mjs), la misma que importa Hugo para sus reportes
// (decisión del usuario, 19-nov-2026: el nombre se cambia en un solo sitio y vale para menú,
// gráficos y reportes). Aquí solo se importa; si no se puede traer, se muestra el código técnico.
const rotulosListos = import('./app/modulos/indicadores-rotulos.mjs?v=2').then((m) => {
  const j = m.default || {};
  for (const e of INDICADORES) e.nombre = j[e.codigo] || e.codigo;
}).catch(() => {
  for (const e of INDICADORES) e.nombre = e.codigo;
});

function fmtCap(v) {
  if (v >= 1e12) return (v / 1e12).toFixed(2).replace('.', ',') + ' B';
  if (v >= 1e9) return (v / 1e9).toFixed(1).replace('.', ',') + ' MM';
  if (v >= 1e7) return Math.round(v / 1e6) + ' M';
  return (v / 1e6).toFixed(1).replace('.', ',') + ' M';
}

function filaActivo(e, conCap) {
  const a = document.createElement('a');
  a.className = 'activo-fila';
  a.href = e.indicador ? '#/i/' + (e.codigo==='iceberg-stock/superficie'?e.codigo:encodeURIComponent(e.codigo)) : '#/a/' + e.clase + '/' + encodeURIComponent(e.codigo);
  // Indicadores: una sola pieza de título (decisión del usuario, 19-nov-2026); sin código técnico a la vista.
  if (e.indicador) { a.innerHTML = '<span class="cod"></span>'; a.querySelector('.cod').textContent = e.nombre; return a; }
  const lectura = parentesisLectura(e);
  const der = conCap && e.cap ? 'caps' : (e.tipo ? 'tipo' : '');
  a.innerHTML = `<span class="cod"></span><span class="nom"></span>` +
    (der === 'caps' ? '<span class="caps">' + ('cap_sub' in e ? '<span class="cap-sub"></span>' : '') + '<span class="cap"></span></span>'
      : der ? '<span class="tipo"></span>' : '');
  a.querySelector('.cod').textContent = e.codigo;
  a.querySelector('.nom').textContent = e.nombre + lectura;
  if (der === 'caps') {
    if ('cap_sub' in e) a.querySelector('.cap-sub').textContent = e.cap_sub ? fmtCap(e.cap_sub) : '—';
    a.querySelector('.cap').textContent = fmtCap(e.cap);
    if (e.cap_fecha) {
      const f = document.createElement('span');
      f.className = 'cap-fecha'; f.textContent = ' ' + (/^\d{4}-\d{2}-\d{2}$/.test(e.cap_fecha) ? fechaLegibleUTC(e.cap_fecha) : e.cap_fecha);
      a.querySelector('.cap').appendChild(f);
    }
  } else if (der === 'tipo') a.querySelector('.tipo').textContent = e.tipo;
  return a;
}

function cabCaps() {
  const d = document.createElement('div');
  d.className = 'fila-cab';
  d.innerHTML = '<span class="lab-cols"><span class="lab-sub">Base</span><span class="lab-cap">Token</span></span>';
  return d;
}

function nodoArbol(titulo, cuenta, lista, conCap) {
  const n = document.createElement('div');
  n.className = 'nodo';
  const b = document.createElement('button');
  b.className = 'nodo-tit';
  b.innerHTML = `<span></span><span class="cuenta"></span>`;
  b.querySelector('span').textContent = titulo;
  b.querySelector('.cuenta').textContent = cuenta;
  b.addEventListener('click', () => n.classList.toggle('abierto'));
  const h = document.createElement('div');
  h.className = 'hijos';
  for (const e of lista) h.appendChild(filaActivo(e, conCap));
  if (!lista.length) h.innerHTML = '<p class="vacio">Vacío por ahora.</p>';
  n.append(b, h);
  return n;
}

// La portada de un mercado (decisión del usuario, 20-nov-2026: experiencia separada por
// mercado, una sola maquinaria): solo su rama y sus indicadores; la búsqueda se limita a él.
function vistaArbol(q, mercado) {
  // Al teclear, la casilla no puede perder el foco ni brincar la vista a la primera
  // coincidencia (fallo del usuario, 21-nov-2026): el árbol se redibuja bajo ella y el foco
  // y la selección se devuelven, sin mover la página.
  const teniaFoco = document.activeElement === elBuscar;
  const selIni = elBuscar.selectionStart, selFin = elBuscar.selectionEnd;
  app.innerHTML = '';
  // Nota de lectura, como la de Variación (decisión del usuario, 20-nov-2026: misma paridad en las dos).
  const nota = document.createElement('p');
  nota.className = 'rachas-nota';
  nota.hidden = true;
  app.append(nota, elBuscar);
  // Indicadores primero en la lista, en stocks y en cripto (decisión del usuario, 21-nov-2026).
  const inds = INDICADORES.filter((e) => e.mercado === mercado).sort((a,b)=>Number(Boolean(b.iceberg))-Number(Boolean(a.iceberg))).map(e=>e.iceberg?{...e,nombre:'Iceberg 2D'}:e);
  if(mercado==='stock')inds.unshift({indicador:true,codigo:'iceberg-stock/superficie',nombre:'Superficie 3D'});
  app.appendChild(nodoArbol('Indicadores', inds.length + (inds.length === 1 ? ' indicador' : ' indicadores'), inds));
  if (mercado === 'stock') {
    const nEmp = nodoArbol('Empresas', EMPRESAS.length + ' activos', EMPRESAS, true);
    nEmp.querySelector('.hijos').prepend(cabCaps());
    const nFon = nodoArbol('Fondos', FONDOS.length + ' activos', FONDOS, true);
    nFon.querySelector('.hijos').prepend(cabCaps());
    app.append(nEmp, nFon);
  } else {
    app.appendChild(nodoArbol('Token', CRIPTOS.length + ' activos', CRIPTOS, true));
  }
  if (!q) { devolverFocoBuscar(teniaFoco, selIni, selFin); return; }
  // La búsqueda localiza y resalta dentro del árbol, sin esconder los demás activos.
  const s = q.toLowerCase();
  const hall = [...TODOS.filter((e) => e.clase === mercado), ...inds].filter((e) =>
    e.codigo.toLowerCase().includes(s) || (e.nombre || '').toLowerCase().includes(s) ||
    (e.lectura || '').toLowerCase().includes(s));
  if (!hall.length) {
    const aviso = document.createElement('p');
    aviso.className = 'vacio';
    aviso.textContent = 'Nada coincide con esa búsqueda.';
    app.prepend(aviso);
    devolverFocoBuscar(teniaFoco, selIni, selFin);
    return;
  }
  for (const e of hall) {
    const fila = app.querySelector(`a.activo-fila[href="${e.indicador ? '#/i/' : '#/a/' + e.clase + '/'}${encodeURIComponent(e.codigo)}"]`);
    if (!fila) continue;
    fila.classList.add('resaltado');
    for (let n = fila.closest('.nodo'); n; n = n.parentElement.closest('.nodo')) n.classList.add('abierto');
  }
  devolverFocoBuscar(teniaFoco, selIni, selFin);
}
// El foco se devuelve tras cada redibujado (ver la nota al inicio de vistaArbol).
function devolverFocoBuscar(teniaFoco, selIni, selFin) {
  if (!teniaFoco) return;
  elBuscar.focus({ preventScroll: true });
  try { elBuscar.setSelectionRange(selIni, selFin); } catch { /* type=search admite selección; si no, el foco basta */ }
}

/* ---------- localizador global: no modifica filtros ni rankings ---------- */
const elBuscarGlobal = $('#buscar-global');
const resultadosGlobal = $('#resultados-global');
const filasGlobal = $('#filas-global');
function coincidenciasGlobales(consulta, catalogo = TODOS) {
  const normalizar = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const q = normalizar(consulta.trim());
  if (!q) return [];
  return catalogo.filter(e => [e.codigo, e.nombre || '', e.lectura || ''].some(s => normalizar(s).includes(q)))
    .sort((a,b) => Number(normalizar(b.codigo) === q) - Number(normalizar(a.codigo) === q)
      || a.codigo.localeCompare(b.codigo) || a.clase.localeCompare(b.clase));
}
function pintarBusquedaGlobal() {
  const q = elBuscarGlobal.value.trim();
  resultadosGlobal.hidden = !q;
  filasGlobal.replaceChildren();
  if (!q) { $('#cuenta-global').textContent = ''; return; }
  const hallados = coincidenciasGlobales(q);
  $('#cuenta-global').textContent = hallados.length ? hallados.length + (hallados.length === 1 ? ' activo' : ' activos') : 'Ningún activo coincide.';
  for (const e of hallados) {
    const etiqueta = e.clase === 'cripto' ? 'Criptos' : e.tipo === 'empresa' ? 'Empresas' : 'Fondos';
    const fila = filaActivo({ ...e, cap: null, tipo: etiqueta }, false);
    filasGlobal.append(fila);
  }
}
elBuscarGlobal.addEventListener('input', pintarBusquedaGlobal);
filasGlobal.addEventListener('click', ev => {
  if (!ev.target.closest('a.activo-fila')) return;
  origenLista = location.hash || '#/';
  estadoLista = { abiertos: [], y: window.scrollY };
});

/* ---------- datos ---------- */
const cacheRegistros = new Map();
async function cargarRegistros(e) {
  const clave = e.clase + '/' + e.codigo;
  if (cacheRegistros.has(clave)) return cacheRegistros.get(clave);
  const cod = encodeURIComponent(e.codigo);
  const meses = e.meses.filter((m) => m >= PISO_VISOR);
  const respuestas = await Promise.all(meses.map((m) =>
    fetch(`${RAW}/${e.clase}/${cod}/${m}_${cod}`).then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' en ' + m);
      return r.json();
    })));

      // Resultado: positivo verde, igualdad gris, negativo rojo. Solo cambia la presentación.
      tdS.textContent = pctTabla(f.ultimoN, f.refN);

    } else {

    cuerpo.appendChild(tr);
  }
  tabla.appendChild(cuerpo);
  caja.appendChild(tabla);
  app.append(caja);
}

async function cargarIndicador(codigo) {
  const clave = 'indicador/' + codigo;
  if (cacheRegistros.has(clave)) return cacheRegistros.get(clave);
  const e = INDICADORES.find((x) => x.codigo === codigo);
  if (!e) return [];
  let puntos;
  if (e.iceberg) puntos = (await cargarIcebergPre(e)).sort((a, b) => a[0] - b[0]);
  else {
    const base = 'https://raw.githubusercontent.com/osmancitov/hugo/main/registros/' + e.codigo;
    const respuestas = await Promise.all(mesesIndicador().map((m) =>
      fetch(`${base}/${m}`).then((r) => (r.ok ? r.json() : []))));
    puntos = respuestas.flat().sort((a, b) => a[0] - b[0]);
  }
  cacheRegistros.set(clave, puntos);
  return puntos;
}

// Línea diaria 0-100 sobre las cinco bandas oficiales del índice. Estática: no hay trazado animado.
function graficoIndicador(ctx, puntos, e, hasta) {
  const n = puntos.length;
  const k = hasta === undefined ? n : Math.min(hasta, n);
  const ALTO = LH + 32;
  const X = (i) => ML + (n === 1 ? PW / 2 : (i / (n - 1)) * PW);
  const Y = (v) => MT + ((100 - v) / 100) * PH;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, LW, ALTO);
  for (const [lo, hi, color, rotulo] of e.bandas) {
    ctx.fillStyle = color;
    ctx.fillRect(ML, Y(hi), PW, Y(lo) - Y(hi));
    ctx.fillStyle = 'rgba(201,204,211,0.6)';
    ctx.font = '11px ' + FUENTE;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(rotulo, ML + 8, (Y(hi) + Y(lo)) / 2);
  }

  ctx.lineWidth = 0.72;

    ctx.strokeStyle = dia === 1 ? GRID_1 : dia === 15 ? GRID_15 : GRID_D;
    ctx.lineWidth = dia === 1 || dia === 15 ? 1.44 : 0.72;
    ctx.beginPath(); ctx.moveTo(X(i), MT); ctx.lineTo(X(i), MT + PH); ctx.stroke();
  }
  ctx.strokeStyle = GRID_D; ctx.lineWidth = 0.72;
  for (const v of [25, 50, 75]) {
    ctx.beginPath(); ctx.moveTo(ML, Y(v)); ctx.lineTo(ML + PW, Y(v)); ctx.stroke();
  }
  ctx.strokeStyle = MARCO; ctx.lineWidth = 1.44;
  for (const v of [0, 100]) {
    ctx.beginPath(); ctx.moveTo(ML, Y(v)); ctx.lineTo(ML + PW, Y(v)); ctx.stroke();
  }
  // ejes
  ctx.fillStyle = TICK;
  ctx.font = '10.5px ' + FUENTE;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const v of [0, 25, 50, 75, 100]) ctx.fillText(String(v), ML - 8, Y(v));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i < n; i++) {
    const f = new Date(puntos[i][0]), dia = f.getUTCDate();
    if (dia === 1 || dia === 15)
      ctx.fillText(`${String(dia).padStart(2, '0')} ${MESES_EN[f.getUTCMonth()]}`, X(i), MT + PH + 8);
  }
  ctx.save();
  ctx.translate(20, MT + PH / 2); ctx.rotate(-Math.PI / 2);
  ctx.font = '12px ' + FUENTE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Índice diario (0-100)', 0, 0);
  ctx.restore();
  // títulos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '14px ' + FUENTE;
  ctx.fillText(`${e.nombre} · índice diario`, LW / 2, 15);
  ctx.fillStyle = TICK; ctx.font = '11px ' + FUENTE;
  ctx.fillText(`0 = miedo extremo · 100 = codicia extrema · ${n} días`, LW / 2, 40);
  // línea y puntos
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < k; i++) { const x = X(i), y = Y(puntos[i][1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.fillStyle = BLUE;
  for (let i = 0; i < k; i++) { ctx.beginPath(); ctx.arc(X(i), Y(puntos[i][1]), 2.5, 0, 7); ctx.fill(); }
  // último valor, con su clase (solo con la curva completa, como la radiografía)
  const uv = puntos[n - 1][1];
  if (k >= n) {
    ctx.font = 'bold 15px ' + FUENTE;
    ctx.fillStyle = '#e8eaed'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${uv} · ${e.clasif(uv)}`, Math.min(X(n - 1) - 12, ML + PW), Math.max(Y(uv) - 16, MT + 8));
  }
  // pie: la fuente va junto al gráfico, como piden los términos de Alternative.me
  const uf = new Date(puntos[n - 1][0]);
  const fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;
  ctx.fillStyle = TICK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '13px ' + FUENTE;
  ctx.fillText(`Datos al ${fecha} (UTC) · Fuente: ${e.fuente}`, LW / 2, ALTO - 13);
}

// El mismo índice en pantalla vertical, con el patrón de radiografiaVertical: los días
// corren de arriba abajo con sus fechas a la izquierda y el valor 0-100 va en X, con
// las bandas oficiales como franjas verticales. Mismos datos y mismas bandas, otro eje.
// Iceberg (decisión del usuario, 20-nov-2026): cada día es una barra completa, el 100 % de
// los activos con vela ese día (verde subió, gris igual, rojo bajó),
// repartido en la frontera entre verde (arriba) y rojo (abajo): la frontera dibuja la
// proporción. Colores sólidos rojo y verde (decisión del usuario, 20-nov-2026: sin
// atenuaciones). Un día sin velas queda sin fila en la serie, sin inventar.
// Misma pieza común de trazado, rejilla de días y colores de la casa; hasta recorta igual.
function pieIceberg(ctx, punto, e, ancho, alto, tamano) {

  const trozos=[{texto:`${fecha.getUTCDate()} ${MESES_ES[fecha.getUTCMonth()]} · `,color:TICK}];
  cifras.forEach(({valor,color},i)=>{
    if(i)trozos.push({texto:' · ',color:TICK});

  for(const t of trozos){ctx.fillStyle=t.color;ctx.fillText(t.texto,x,alto-tamano*2-5);x+=ctx.measureText(t.texto).width;}
  const fuente=`Fuente: ${e.fuente}`;

  ctx.font=`${tamano*escala}px ${FUENTE}`;ctx.textAlign='center';ctx.fillStyle=TICK;
  ctx.fillText(fuente,ancho/2,alto-tamano*.6-2);
}

  // títulos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '14px ' + FUENTE;
  ctx.fillText(`${e.nombre} · subieron, iguales y bajaron por día`, LW / 2, 15);
  ctx.fillStyle = TICK; ctx.font = '11px ' + FUENTE;
  ctx.fillText(`cada día es el 100 % de los activos con vela ese día · ${LEYENDA_LECTURA} · ${n} días`, LW / 2, 40);
  // el último día, al completar el trazado
  if (k >= n) {
    const uf = new Date(puntos[n - 1][0]);
    const fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;
    ctx.fillStyle = TICK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '13px ' + FUENTE;
    pieIceberg(ctx, puntos[n - 1], e, LW, ALTO, 13);
  }
}

function graficoIndicadorVertical(ctx, puntos, e, alto, hasta) {
  const w = 700, left = 88, right = 612, top = 134, bottom = alto - 110;
  const n = puntos.length;
  const k = hasta === undefined ? n : Math.min(hasta, n);
  const X = (v) => left + (v / 100) * (right - left);
  const Y = (i) => top + (i / (n - 1)) * (bottom - top);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, alto);
  // títulos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '26px ' + FUENTE;
  ctx.fillText(`${e.nombre} · índice diario`, w / 2, 26);
  ctx.fillStyle = TICK; ctx.font = '18px ' + FUENTE;
  ctx.fillText(`0 = miedo extremo · 100 = codicia extrema · ${n} días`, w / 2, 58);
  // bandas oficiales: franjas verticales con su rótulo en vertical
  for (const [lo, hi, color, rotulo] of e.bandas) {
    ctx.fillStyle = color;
    ctx.fillRect(X(lo), top, X(hi) - X(lo), bottom - top);
    ctx.save();
    ctx.fillStyle = 'rgba(201,204,211,0.6)';
    ctx.font = '18px ' + FUENTE;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.translate((X(lo) + X(hi)) / 2, (top + bottom) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(rotulo, 0, 0);
    ctx.restore();
  }
  // rejilla de días y fechas a la izquierda, como la radiografía vertical
  ctx.font = '20px ' + FUENTE; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const f = new Date(puntos[i][0]), dia = f.getUTCDate();
    ctx.strokeStyle = dia === 1 ? GRID_1 : dia === 15 ? GRID_15 : GRID_D;
    ctx.lineWidth = dia === 1 || dia === 15 ? 1.5 : 0.7;
    ctx.beginPath(); ctx.moveTo(left, Y(i)); ctx.lineTo(right, Y(i)); ctx.stroke();
    if (dia === 1 || dia === 15 || i === 0 || i === n - 1) {
      // El extremo no duplica una fecha del día anterior.
      const cerca = i === n - 1 && i > 0 && [1, 15].includes(new Date(puntos[i - 1][0]).getUTCDate());
      if (!cerca) { ctx.fillStyle = TICK; ctx.fillText(String(dia).padStart(2, '0') + ' ' + MESES_ES[f.getUTCMonth()], left - 14, Y(i)); }
    }
  }
  // valores 0-100 arriba y abajo, con su rejilla vertical
  ctx.font = '20px ' + FUENTE; ctx.textAlign = 'center';
  for (const v of [0, 25, 50, 75, 100]) {
    ctx.strokeStyle = v === 0 || v === 100 ? MARCO : GRID_D;
    ctx.lineWidth = v === 0 || v === 100 ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(X(v), top); ctx.lineTo(X(v), bottom); ctx.stroke();
    ctx.fillStyle = TICK; ctx.fillText(String(v), X(v), top - 23);
    ctx.fillText(String(v), X(v), bottom + 26);
  }
  ctx.strokeStyle = MARCO; ctx.lineWidth = 1.5; ctx.strokeRect(left, top, right - left, bottom - top);
  // línea y puntos, recortados al marco
  ctx.save();
  ctx.beginPath(); ctx.rect(left, top, right - left, bottom - top); ctx.clip();
  ctx.strokeStyle = BLUE; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < k; i++) { const x = X(puntos[i][1]), y = Y(i); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.fillStyle = BLUE;
  for (let i = 0; i < k; i++) { ctx.beginPath(); ctx.arc(X(puntos[i][1]), Y(i), 3.5, 0, 7); ctx.fill(); }
  ctx.restore();
  // último valor, con su clase (solo con la curva completa)
  const uv = puntos[n - 1][1];
  if (k >= n) {
  const textoUv = `${uv} · ${e.clasif(uv)}`;
  const derecha = X(uv) > (left + right) / 2;
  ctx.font = 'bold 22px ' + FUENTE;
  ctx.fillStyle = '#e8eaed'; ctx.textAlign = derecha ? 'right' : 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = BG;
  const tx = derecha ? Math.min(X(uv) - 14, right - 8) : Math.max(X(uv) + 14, left + 8);
  const ty = Math.max(Y(n - 1) - 26, top + 14);
  ctx.strokeText(textoUv, tx, ty); ctx.fillText(textoUv, tx, ty);
  }
  // pie: la fuente va junto al gráfico, como piden los términos de Alternative.me
  const uf = new Date(puntos[n - 1][0]);
  const fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;
  ctx.fillStyle = TICK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '18px ' + FUENTE;
  ctx.fillText(`Datos al ${fecha} (UTC) · Fuente: ${e.fuente}`, w / 2, alto - 13);
}

// El iceberg en vertical: días de arriba abajo, verde a la derecha del cero y rojo a la
// izquierda. La pieza común gira y reajusta igual que con los otros indicadores.
function graficoIcebergVertical(ctx, puntos, e, alto, hasta) {
  const w = 700, left = 88, right = 612, top = 134, bottom = alto - 110;
  const n = puntos.length;
  const k = hasta === undefined ? n : Math.min(hasta, n);
  const Y = (i) => top + (n === 1 ? (bottom - top) / 2 : (i / (n - 1)) * (bottom - top));
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, alto);
  // títulos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '26px ' + FUENTE;
  ctx.fillText(`${e.nombre} · subieron, iguales y bajaron`, w / 2, 26);
  ctx.fillStyle = TICK; ctx.font = '18px ' + FUENTE;
  ctx.fillText(`cada día es el 100 % de los activos con vela ese día · ${n} días`, w / 2, 58);
  // barras completas: rojo desde la izquierda hasta la frontera, verde hasta la derecha
  const grueso = n === 1 ? (bottom - top) : Math.max(1, (bottom - top) / (n - 1));
  for (let i = 0; i < k; i++) {
    const sub = puntos[i][1], baj = puntos[i][2], igual = puntos[i][3], total = sub + baj + igual;
    if (!total) continue;
    const frontera = left + (baj / total) * (right - left);
    const finGris = frontera + (igual / total) * (right - left);
    const y = Y(i) - grueso / 2;
    if (baj) { ctx.fillStyle = RED_S; ctx.fillRect(left, y, frontera - left, grueso); }
    if (igual) { ctx.fillStyle = COLORES_LECTURA.gris; ctx.fillRect(frontera, y, finGris - frontera, grueso); }
    if (sub) { ctx.fillStyle = GREEN_S; ctx.fillRect(finGris, y, right - finGris, grueso); }
  }
  // rejilla de días y fechas a la izquierda, como la radiografía vertical
  ctx.font = '20px ' + FUENTE; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const f = new Date(puntos[i][0]), dia = f.getUTCDate();
    ctx.strokeStyle = dia === 1 ? GRID_1 : dia === 15 ? GRID_15 : GRID_D;
    ctx.lineWidth = dia === 1 || dia === 15 ? 1.5 : 0.7;
    ctx.beginPath(); ctx.moveTo(left, Y(i)); ctx.lineTo(right, Y(i)); ctx.stroke();
    if (dia === 1 || dia === 15 || i === 0 || i === n - 1) {
      const cerca = i === n - 1 && i > 0 && [1, 15].includes(new Date(puntos[i - 1][0]).getUTCDate());
      if (!cerca) { ctx.fillStyle = TICK; ctx.fillText(String(dia).padStart(2, '0') + ' ' + MESES_ES[f.getUTCMonth()], left - 14, Y(i)); }
    }
  }
  // guías de proporción: la central es la paridad
  for (const p of [0.25, 0.5, 0.75]) {
    const x = left + p * (right - left);
    ctx.strokeStyle = p === 0.5 ? ZERO : GRID_D;
    ctx.lineWidth = p === 0.5 ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
  }
  ctx.strokeStyle = MARCO; ctx.lineWidth = 1.5; ctx.strokeRect(left, top, right - left, bottom - top);
  // el último día, al completar el trazado
  if (k >= n) {
    const uf = new Date(puntos[n - 1][0]);
    const fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;
    ctx.fillStyle = TICK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '20px ' + FUENTE;
    pieIceberg(ctx, puntos[n - 1], e, w, alto, 18);
  }
}

function vistaIndicador(codigo, en = null, rotulo = null, limpio = false, ndias = null) {
  const e = INDICADORES.find((x) => x.codigo === codigo);
  if (!e) { location.hash = ''; return; }
  if (!en) app.innerHTML = '';
  const volver = document.createElement('a');
  volver.className = 'volver'; volver.href = origenLista; volver.textContent = 'volver';
  const ficha = document.createElement('div');
  ficha.className = 'ficha';
  const h1 = document.createElement(en ? 'h2' : 'h1');
  h1.innerHTML = '<span class="cod"></span>';
  h1.querySelector('.cod').textContent = rotulo ? e.nombre + ' · ' + rotulo : e.nombre;
  ficha.appendChild(h1);
  const meta = document.createElement('div');
  meta.className = 'meta';
  const tipoMeta = document.createElement('span');
  tipoMeta.textContent = e.tipo;
  meta.appendChild(tipoMeta);
  ficha.appendChild(meta);
  const caja = document.createElement('div');
  caja.className = 'lienzo-caja';
  const estado = document.createElement('p');
  estado.className = 'estado'; estado.textContent = 'Trayendo los registros…';
  const pie = document.createElement('div');
  pie.className = 'pie-grafica';
  if (en) en.append(ficha, caja, pie); else app.append(volver, ficha, caja, pie);
  caja.appendChild(estado);
  cargarIndicador(codigo).then((todos) => {
    const puntos = ndias && todos.length ? todos.filter(([ms]) => ms >= todos[todos.length - 1][0] - (ndias - 1) * 86400000) : todos; // período global de Mercado: solo recorte temporal (25-nov-2026)
    estado.remove();
    if (puntos.length < 2) {
      caja.innerHTML = '<p class="estado">Todavía no hay suficientes días registrados para dibujar.</p>';
      return;
    }
    if (!caja.isConnected) return;
    // Las mismas reglas de presentación que las demás gráficas: en pantalla vertical
    // el índice se dibuja en vertical; la pieza común gira, reajusta y limpia igual.
    const uf = new Date(puntos[puntos.length - 1][0]);
    graficador(caja, pie, {
      total: () => puntos.length,
      dibujar: (ctx, geometria, hasta) => {
        if (e.iceberg) {
          if (geometria.vertical) graficoIcebergVertical(ctx, puntos, e, geometria.alto, hasta);
          else graficoIceberg(ctx, puntos, e, hasta);
        } else if (geometria.vertical) graficoIndicadorVertical(ctx, puntos, e, geometria.alto, hasta);
        else graficoIndicador(ctx, puntos, e, hasta);
      },
      codigo: e.codigo,
      fecha: () => uf,
      sinDescarga: limpio,
    });
    if (limpio) return; // prototipo unificada (25-nov-2026): sin texto explicativo ni descarga
    const fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;
    const nota = document.createElement('span');
    nota.className = 'nota';
    const origen = 'los registros publicados';
    nota.append(`Trazada en vivo desde ${origen} · datos al ${fecha} (UTC)${e.notaDias ? ' · ' + e.notaDias : ''} · Fuente: `);
    if (e.fuenteUrl) {
      const enlace = document.createElement('a');
      enlace.href = e.fuenteUrl;
      enlace.target = '_blank';
      enlace.rel = 'noopener';
      enlace.textContent = e.fuente;
      nota.append(enlace);
    } else nota.append(e.fuente);
    pie.append(nota);
  }).catch((err) => {
    estado.textContent = 'No pude traer los registros de este indicador (' + err.message + ').';
  });
}

/* ---------- radiografía (port fiel del productor) ---------- */
function mediana(xs) {
  const s = [...xs].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
const miles = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function preparar(filas) {
  const ohlc4 = filas.map((r) => (+r[1] + +r[2] + +r[3] + +r[4]) / 4);
  const vol = filas.map((r) => +r[5]);
  const fechas = filas.map((r) => new Date(r[0]));
  // Variación de cada vela entre su apertura y su cierre, como la app.
  const rets = filas.map((r) => (+r[4] / +r[1] - 1) * 100);
  const rs = rets;
  const vp = vol.map((v, i) => v / ohlc4[i]);
  const vmin = Math.min(...vp), vmax = Math.max(...vp);
  const vmed = mediana(vp);
  const pos = rets.filter((r) => r > 0), neg = rets.filter((r) => r < 0);
  return {
    fechas, rs, vp, vmin, vmax, vmed,
    asum: pos.reduce((a, b) => a + b, 0), ansum: neg.reduce((a, b) => a + b, 0),
    dpos: pos.length, dneg: neg.length,
    ultima: filas[filas.length - 1][6],
  };
}

function lienzo(caja, geometria) {
  const dpr = window.devicePixelRatio || 1;
  const ancho = caja.clientWidth - 16;
  const cssW = Math.min(ancho, geometria.ancho);
  const escala = cssW / geometria.ancho;
  const cv = document.createElement('canvas');
  cv.width = Math.round(geometria.ancho * escala * dpr);
  cv.height = Math.round(geometria.alto * escala * dpr);
  cv.style.width = Math.round(cssW) + 'px';
  cv.style.height = Math.round(geometria.alto * escala) + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(escala * dpr, escala * dpr);
  caja.replaceChildren(cv);
  return ctx;
}

// Regla común de presentación de las gráficas: la orientación y el ancho cambian
// el dibujo, nunca los datos. Una sola pieza gira el lienzo en pantallas verticales,
// reajusta al cambiar el ancho y limpia sus oyentes al salir de la vista; cada
// gráfica aporta solo su geometría y su trazado.
function graficaAdaptable(caja, geometriaPara, dibujar, alLimpiar) {
  const orientacion = matchMedia('(orientation: portrait)');
  const g = { ctx: null, geometria: null, ultimoAncho: 0 };
  g.configurar = () => {
    g.geometria = geometriaPara(orientacion.matches);
    g.geometria.vertical = orientacion.matches;
    g.ctx = lienzo(caja, g.geometria);
    g.ultimoAncho = caja.clientWidth;
  };
  g.redibujar = () => dibujar(g.ctx, g.geometria);
  const reconfigurar = () => { g.configurar(); g.redibujar(); };
  const ajustar = new ResizeObserver(() => {
    if (!caja.isConnected) { ajustar.disconnect(); return; }
    if (g.ultimoAncho === caja.clientWidth && g.geometria.vertical === orientacion.matches) return;
    reconfigurar();
  });
  ajustar.observe(caja);
  const girar = () => { if (caja.isConnected) reconfigurar(); };
  orientacion.addEventListener('change', girar);
  const limpiezaPrevia = limpiarGrafica; // varias gráficas en una página: cada una suma su limpieza
  limpiarGrafica = () => {
    limpiezaPrevia();
    if (alLimpiar) alLimpiar();
    ajustar.disconnect(); orientacion.removeEventListener('change', girar);
  };
  g.configurar();
  return g;
}

// Regla común del trazado: toda gráfica dibuja su curva en el mismo tiempo, repite igual
// y respeta el movimiento reducido (dibuja el resultado completo, sin animar). Un solo
// controlador y una sola duración; cada gráfica aporta solo su dibujo, dibujar(hasta),
// donde hasta es el número de puntos ya trazados y sin él se dibuja completa.
const DURACION_TRAZADO_MS = 1000; // decisión del usuario, 20-nov-2026: bajar el graficado a 1 segundo
function trazadoAnimado(caja, total, dibujar) {
  const sinMovimiento = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let animId = null;
  const t = {};
  t.cancelar = () => { if (animId) cancelAnimationFrame(animId); animId = null; };
  t.terminar = () => { t.cancelar(); dibujar(); };
  t.trazar = () => {
    t.cancelar();
    if (sinMovimiento) { t.terminar(); return; }
    const t0 = performance.now();
    const paso = (ahora) => {
      if (!caja.isConnected) { animId = null; return; }
      const p = Math.min(1, (ahora - t0) / DURACION_TRAZADO_MS);
      const k = 1 + Math.floor(p * (total() - 1));
      if (p < 1) { dibujar(k); animId = requestAnimationFrame(paso); }
      else { dibujar(); animId = null; }
    };
    animId = requestAnimationFrame(paso);
  };
  return t;
}

// Graficador común: el ensamblado que toda gráfica del visor necesita, escrito una vez.
// Cada caso (activo, indicador, lo que venga) entrega solo su configuración:
//   total()   cuántos puntos tiene la serie (de ahí salen geometría y progreso del trazado)
//   dibujar(ctx, geometria, hasta, escala)   su dibujo; hasta = puntos ya trazados
//   escalas   {valores} si la gráfica usa escala; se dibuja con el primer valor (sin botón para cambiarla)
//   codigo, fecha()   nombre y fecha del PNG descargable
// Y solo si el caso se desvía de lo común (todo lo demás hereda el valor por defecto):
//   geometria   (vertical, total) -> {ancho, alto}, si su lienzo no es el común
//   archivo     (vertical, escala) -> nombre del PNG, si no sigue el patrón común
// El graficador pone geometría vertical/horizontal, orientación y reajuste, trazado
// (duración única) y Descargar imagen.
const GRAFICADOR_COMUN = {
  geometria: (vertical, total) => vertical
    ? { ancho: 700, alto: Math.max(1400, total * 18 + 320) }
    : { ancho: LW, alto: LH + 32 },
  archivo(vertical, escala) {
    return `${this.codigo}_${this.fecha().toISOString().slice(0, 10)}_${vertical ? 'vertical' : 'horizontal'}${escala === undefined ? '' : '_escala-' + escala}.png`;
  },
};
function graficador(caja, pie, deCaso) {
  const cfg = { ...GRAFICADOR_COMUN, ...deCaso };
  const geometriaPara = (vertical) => cfg.geometria(vertical, cfg.total());
  const escala = () => (cfg.escalas ? cfg.escalas.valores[0] : undefined);
  const dibujarEn = (ctx, hasta) => cfg.dibujar(ctx, graf.geometria, hasta, escala());
  const traza = trazadoAnimado(caja, cfg.total, (hasta) => dibujarEn(graf.ctx, hasta));
  const graf = graficaAdaptable(caja, geometriaPara, () => traza.terminar(), () => traza.cancelar());
  const boton = (texto, titulo, alClic) => {
    const b = document.createElement('button');
    b.className = 'boton'; b.textContent = texto;
    if (titulo) b.title = titulo;
    b.addEventListener('click', alClic);
    return b;
  };
  const controles = document.createElement('div');
  controles.className = 'controles-grafica';
  if (!cfg.sinDescarga) controles.append(boton('Descargar imagen', '', () => {
    traza.terminar();
    // Redibuja en alta resolución; limita el área para teléfonos con menos memoria.
    // No amplía los píxeles del lienzo mostrado en pantalla.
    const { ancho, alto, vertical } = graf.geometria;
    const salida = document.createElement('canvas');
    const resolucion = Math.min(3, Math.sqrt(14000000 / (ancho * alto)), 14000 / alto);
    salida.width = Math.floor(ancho * resolucion);
    salida.height = Math.floor(alto * resolucion);
    const tinta = salida.getContext('2d'); tinta.scale(resolucion, resolucion); dibujarEn(tinta);
    salida.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = cfg.archivo(vertical, escala());
      a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000);
    }, 'image/png');
  }));
  pie.append(controles);
  traza.trazar();
  return { configurar: graf.configurar, trazar: traza.trazar, terminar: traza.terminar };
}

function radiografia(ctx, d, codigo, subtitulo, hasta, limite = 5) {
  const YLO = -limite, YHI = limite, TLO = -limite + (limite === 5 ? 1 : 2), THI = limite - 1;
  const npts = d.rs.length;
  const X = (i) => ML + (i / (npts - 1)) * PW;
  const Y = (v) => MT + ((YHI - v) / (YHI - YLO)) * PH;

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, LW, LH);

  // rejilla
  ctx.lineWidth = 0.72;
  for (let i = 0; i < npts; i++) {
    const dia = d.fechas[i].getUTCDate();
    ctx.strokeStyle = dia === 1 ? GRID_1 : dia === 15 ? GRID_15 : GRID_D;
    ctx.lineWidth = dia === 1 || dia === 15 ? 1.44 : 0.72;
    ctx.beginPath(); ctx.moveTo(X(i), MT); ctx.lineTo(X(i), MT + PH); ctx.stroke();
  }
  ctx.strokeStyle = GRID_D; ctx.lineWidth = 0.72;
  for (let v = TLO; v <= THI; v += limite === 5 ? 1 : 2) {
    ctx.beginPath(); ctx.moveTo(ML, Y(v)); ctx.lineTo(ML + PW, Y(v)); ctx.stroke();
  }
  ctx.strokeStyle = MARCO; ctx.lineWidth = 1.44;
  for (const v of [YLO, YHI]) {
    ctx.beginPath(); ctx.moveTo(ML, Y(v)); ctx.lineTo(ML + PW, Y(v)); ctx.stroke();
  }

  // ejes
  ctx.fillStyle = TICK;
  ctx.font = '10.5px ' + FUENTE;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const marcas = [YLO]; for (let v = TLO; v <= THI; v += limite === 5 ? 1 : 2) marcas.push(v); marcas.push(YHI);
  for (const v of marcas) ctx.fillText(v + '%', ML - 8, Y(v));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i < npts; i++) {
    const f = d.fechas[i], dia = f.getUTCDate();
    if (dia === 1 || dia === 15)
      ctx.fillText(`${String(dia).padStart(2, '0')} ${MESES_EN[f.getUTCMonth()]}`, X(i), MT + PH + 8);
  }
  ctx.save();
  ctx.translate(20, MT + PH / 2); ctx.rotate(-Math.PI / 2);
  ctx.font = '12px ' + FUENTE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Variación diaria', 0, 0);
  ctx.restore();

  // títulos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '14px ' + FUENTE;
  ctx.fillText(`${codigo} variación diaria`, LW / 2, 15);
  ctx.fillStyle = '#9aa0ac'; ctx.font = '11px ' + FUENTE;
  ctx.fillText(subtitulo, LW / 2, 40);

  const fin = hasta === undefined ? npts : hasta;

  // áreas, cero y línea van recortadas al marco (matplotlib recorta las colecciones al axes)
  ctx.save();
  ctx.beginPath(); ctx.rect(ML, MT, PW, PH); ctx.clip();

  // áreas
  for (let i = 1; i < fin; i++) {
    const r = d.rs[i];
    if (r === 0) continue;
    ctx.fillStyle = r > 0 ? GREEN : RED;
    ctx.beginPath();
    ctx.moveTo(X(i - 1), Y(0)); ctx.lineTo(X(i - 1), Y(r));
    ctx.lineTo(X(i), Y(r)); ctx.lineTo(X(i), Y(0));
    ctx.closePath(); ctx.fill();
  }

  // línea cero
  ctx.strokeStyle = ZERO; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(ML, Y(0)); ctx.lineTo(ML + PW, Y(0)); ctx.stroke();

  // línea v/p con grosor
  const wpix = (v) => d.vmax > d.vmin
    ? Math.max(0.7, Math.min(12, 0.7 + ((v - d.vmin) / (d.vmax - d.vmin)) * 11.3)) : 0.7;
  ctx.strokeStyle = BLUE; ctx.globalAlpha = 0.9;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < fin; i++) {
    ctx.lineWidth = wpix(d.vp[i]) * 0.72;
    ctx.beginPath(); ctx.moveTo(X(i - 1), Y(d.rs[i - 1])); ctx.lineTo(X(i), Y(d.rs[i])); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (fin < npts) return null; // animación en curso: sin marcas ni leyenda todavía

  // leyenda (primero medimos para que las marcas la esquiven)
  const lineas = [
    { tipo: 'lin', w: 0.7 * 0.72, txt: `mín ${Math.round(d.vmin)} v/p` },
    { tipo: 'lin', w: 12 * 0.72, txt: `máx ${miles(d.vmax)} v/p` },
    { tipo: 'parche', c: GREEN, txt: `+${Math.round(d.asum)} %d / ${d.dpos} d` },
    { tipo: 'parche', c: RED, txt: `−${Math.round(Math.abs(d.ansum))} %d / ${d.dneg} d` },
  ];
  if (d.ansum !== 0 && d.dneg > 0)
    lineas.push({ tipo: 'flag', txt: `${(d.asum / Math.abs(d.ansum)).toFixed(2)} / ${(d.dpos / d.dneg).toFixed(2)}` });
  ctx.font = '10px ' + FUENTE;
  let anchoTxt = 0;
  for (const l of lineas) anchoTxt = Math.max(anchoTxt, ctx.measureText(l.txt).width);
  const legW = anchoTxt + 46, legH = lineas.length * 15 + 8;
  const legX = ML + PW - legW - 4, legY = MT + 4;

  // marcas fuera del marco
  const filasTxt = [];
  const ultimoX = () => (filasTxt.length ? filasTxt[filasTxt.length - 1][0] : null);
  for (let i = 1; i < npts; i++) {
    const r = d.rs[i];
    if (Math.abs(r) <= YHI) continue;
    const arriba = r > 0, ym = arriba ? YHI : YLO;
    ctx.fillStyle = arriba ? GREEN_S : RED_S; ctx.globalAlpha = 0.9;
    ctx.beginPath();
    if (arriba) { ctx.moveTo(X(i), Y(ym) - 6); ctx.lineTo(X(i) - 5.5, Y(ym) + 6); ctx.lineTo(X(i) + 5.5, Y(ym) + 6); }
    else { ctx.moveTo(X(i), Y(ym) + 6); ctx.lineTo(X(i) - 5.5, Y(ym) - 6); ctx.lineTo(X(i) + 5.5, Y(ym) - 6); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

    const pi = d.rs[i - 1] ?? 0, si = d.rs[i + 1] ?? 0;
    const pref = Math.abs(si - r) > Math.abs(pi - r) ? -1.8 : 1.8;
    let iTxt = i + pref;
    const ult = ultimoX();
    for (const cand of [pref, 0, -pref]) {
      if (ult === null || i + cand > ult + 0.8) { iTxt = i + cand; break; }
    }
    let fila = 0;
    for (const [xp, fp] of filasTxt) if (Math.abs(xp - iTxt) < 6 && fp === fila) fila++;
    // esquivar la leyenda, medido en coordenadas de datos como el productor
    const invX = (px) => ((px - ML) / PW) * (npts - 1);
    const invY = (px) => YHI - ((px - MT) / PH) * (YHI - YLO);
    const bb = { x0: invX(legX), x1: invX(legX + legW), y0: invY(legY + legH) };
    const medio = 23.0 * npts / 1409.0; // semiancho estimado de una etiqueta, en días
    if (arriba) {
      while (iTxt + medio > bb.x0 && iTxt - medio < bb.x1 &&
             ym - (1.6 + fila * 2.1) > bb.y0) fila++;
    }
    filasTxt.push([iTxt, fila]);
    const paso = 2.1;
    const yt = arriba ? ym - (1.6 + fila * paso) : ym + (1.2 + fila * paso);
    const yc0 = arriba ? ym - 0.6 : ym + 0.6;
    const yc1 = arriba ? yt + 0.15 : yt - 0.15;
    ctx.strokeStyle = TICK; ctx.globalAlpha = 0.45; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(X(i), Y(yc0)); ctx.lineTo(X(iTxt), Y(yc1)); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = '8px ' + FUENTE;
    ctx.textAlign = 'center'; ctx.textBaseline = arriba ? 'top' : 'bottom';
    ctx.lineWidth = 2.5; ctx.strokeStyle = BG;
    const txt = (arriba ? '+' : '−') + Math.abs(r).toFixed(1) + ' %';
    ctx.strokeText(txt, X(iTxt), Y(yt));
    ctx.fillStyle = TICK;
    ctx.fillText(txt, X(iTxt), Y(yt));
  }

  // leyenda encima de todo
  ctx.fillStyle = '#161a25'; ctx.strokeStyle = '#1a1e2a';
  ctx.beginPath(); ctx.rect(legX, legY, legW, legH); ctx.fill(); ctx.stroke();
  ctx.font = '10px ' + FUENTE;
  lineas.forEach((l, k) => {
    const y = legY + 11 + k * 15;
    if (l.tipo === 'lin') {
      ctx.strokeStyle = BLUE; ctx.globalAlpha = 0.9; ctx.lineWidth = Math.max(0.5, l.w);
      ctx.beginPath(); ctx.moveTo(legX + 8, y - 3); ctx.lineTo(legX + 26, y - 3); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (l.tipo === 'parche') {
      ctx.fillStyle = l.c; ctx.fillRect(legX + 8, y - 8, 18, 10);
    } else {
      ctx.fillStyle = GREEN;
      ctx.beginPath(); ctx.moveTo(legX + 8, y - 8); ctx.lineTo(legX + 8, y + 2); ctx.lineTo(legX + 17, y - 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = RED;
      ctx.beginPath(); ctx.moveTo(legX + 17, y + 2); ctx.lineTo(legX + 26, y + 2); ctx.lineTo(legX + 26, y - 8); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = TICK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(l.txt, legX + 32, y - 3);
  });
}

function radiografiaVertical(ctx, d, codigo, subtitulo, hasta, limite, alto) {
  // El marco va centrado en el lienzo; las fechas quedan fuera, a la izquierda.
  const w = 700, left = 88, right = 612, top = 134, bottom = alto - 260;
  const n = d.rs.length;
  const X = (v) => left + ((v + limite) / (2 * limite)) * (right - left);
  const Y = (i) => top + (i / (n - 1)) * (bottom - top);
  const fin = hasta === undefined ? n : hasta;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, alto);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '26px ' + FUENTE;
  ctx.fillText(codigo + ' variación diaria', w / 2, 26);
  ctx.fillStyle = '#9aa0ac'; ctx.font = '18px ' + FUENTE;
  // Dos líneas como máximo, sin comprimir las letras del subtítulo.
  const palabras = subtitulo.split(' '); let linea = '', filas = [];
  for (const palabra of palabras) {
    if (ctx.measureText(linea + ' ' + palabra).width > 650 && linea) { filas.push(linea); linea = palabra; }
    else linea += (linea ? ' ' : '') + palabra;
  }
  filas.push(linea); filas.slice(0, 2).forEach((l, i) => ctx.fillText(l, w / 2, 58 + i * 24));
  const paso = limite === 5 ? 1 : limite === 10 ? 2 : 5;
  const marcas = [-limite];
  for (let v = -limite + paso; v < limite; v += paso) marcas.push(v);
  if (!marcas.includes(0)) marcas.push(0);
  marcas.push(limite); marcas.sort((a,b) => a-b);
  ctx.font = '20px ' + FUENTE;
  for (const v of marcas) {
    ctx.strokeStyle = v === 0 ? ZERO : GRID_D; ctx.lineWidth = v === 0 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(X(v), top); ctx.lineTo(X(v), bottom); ctx.stroke();
    ctx.fillStyle = TICK; ctx.fillText((v > 0 ? '+' : '') + v + '%', X(v), top - 23);
    ctx.fillText((v > 0 ? '+' : '') + v + '%', X(v), bottom + 26);
  }
  ctx.font = '20px ' + FUENTE; ctx.textAlign = 'right';
  for (let i = 0; i < n; i++) {
    const f = d.fechas[i], dia = f.getUTCDate();
    ctx.strokeStyle = dia === 1 ? GRID_1 : dia === 15 ? GRID_15 : GRID_D;
    ctx.lineWidth = dia === 1 || dia === 15 ? 1.5 : 0.7;
    ctx.beginPath(); ctx.moveTo(left, Y(i)); ctx.lineTo(right, Y(i)); ctx.stroke();
    if (dia === 1 || dia === 15 || i === 0 || i === n - 1) {
      // El extremo no duplica una fecha del día anterior.
      const cerca = i === n - 1 && i > 0 && [1,15].includes(d.fechas[i-1].getUTCDate());
      if (!cerca) {ctx.fillStyle = TICK;ctx.fillText(String(dia).padStart(2,'0') + ' ' + MESES_ES[f.getUTCMonth()], left - 14, Y(i));}
    }
  }
  ctx.strokeStyle = MARCO; ctx.lineWidth = 1.5; ctx.strokeRect(left, top, right-left, bottom-top);
  ctx.save(); ctx.beginPath(); ctx.rect(left, top, right-left, bottom-top); ctx.clip();
  for (let i = 1; i < fin; i++) {
    const v = d.rs[i]; if (v === 0) continue;
    ctx.fillStyle = v > 0 ? GREEN : RED;
    ctx.fillRect(Math.min(X(0),X(v)),Y(i-1),Math.abs(X(v)-X(0)),Y(i)-Y(i-1));
  }
  const grosor = (v) => d.vmax > d.vmin ? Math.max(1,Math.min(12,1+((v-d.vmin)/(d.vmax-d.vmin))*11)) : 1;
  ctx.strokeStyle = BLUE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i=1;i<fin;i++) {
    ctx.lineWidth = grosor(d.vp[i]);ctx.beginPath();ctx.moveTo(X(d.rs[i-1]),Y(i-1));ctx.lineTo(X(d.rs[i]),Y(i));ctx.stroke();
  }
  ctx.restore();
  if (fin < n) return;
  // Valores fuera de escala: triángulo en el borde y rótulo con su valor real.
  let ultPos = -100, ultNeg = -100, carrilPos = 0, carrilNeg = 0;
  ctx.font = '20px ' + FUENTE;
  for (let i=1;i<n;i++) {
    const v=d.rs[i];if(Math.abs(v)<=limite)continue;
    const pos=v>0, x=pos?right:left, y=Y(i);
    let carril;
    if(pos){carrilPos=y-ultPos<26?(carrilPos+1)%3:0;ultPos=y;carril=carrilPos;}
    else{carrilNeg=y-ultNeg<26?(carrilNeg+1)%3:0;ultNeg=y;carril=carrilNeg;}
    const tx=pos?right-18-carril*85:left+18+carril*85;
    ctx.fillStyle=pos?GREEN_S:RED_S;ctx.beginPath();ctx.moveTo(x+(pos?12:-12),y);ctx.lineTo(x,y-6);ctx.lineTo(x,y+6);ctx.closePath();ctx.fill();
    ctx.textAlign=pos?'right':'left';ctx.lineWidth=4;ctx.strokeStyle=BG;
    const texto=(pos?'+':'−')+Math.abs(v).toFixed(1)+'%';ctx.strokeText(texto,tx,y);ctx.fillText(texto,tx,y);
  }
  ctx.textAlign='left';ctx.font='20px '+FUENTE;
  const y0=bottom+100;
  // Las mismas entradas que la leyenda horizontal, cada una con su muestra.
  const muestraLin=(x,y,w)=>{ctx.strokeStyle=BLUE;ctx.globalAlpha=0.9;ctx.lineCap='round';ctx.lineWidth=Math.max(1,w);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+30,y);ctx.stroke();ctx.globalAlpha=1;};
  const muestraParche=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y-8,30,16);};
  const muestraFlag=(x,y)=>{
    ctx.fillStyle=GREEN;ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.lineTo(x+15,y-8);ctx.closePath();ctx.fill();
    ctx.fillStyle=RED;ctx.beginPath();ctx.moveTo(x+15,y+8);ctx.lineTo(x+30,y+8);ctx.lineTo(x+30,y-8);ctx.closePath();ctx.fill();
  };
  const rotulo=(x,y,txt)=>{ctx.fillStyle=TICK;ctx.fillText(txt,x+38,y);};
  rotulo(30,y0,`mín ${Math.round(d.vmin)} v/p`);muestraLin(30,y0,grosor(d.vmin));
  rotulo(30,y0+36,`máx ${miles(d.vmax)} v/p`);muestraLin(30,y0+36,12);
  const x2=380;
  rotulo(x2,y0,`+${Math.round(d.asum)} %d / ${d.dpos} d`);muestraParche(x2,y0,GREEN);
  rotulo(x2,y0+36,`−${Math.round(Math.abs(d.ansum))} %d / ${d.dneg} d`);muestraParche(x2,y0+36,RED);
  if(d.ansum!==0&&d.dneg>0){rotulo(x2,y0+72,`${(d.asum/Math.abs(d.ansum)).toFixed(2)} / ${(d.dpos/d.dneg).toFixed(2)}`);muestraFlag(x2,y0+72);}
}

/* ---------- vista de activo ---------- */
function vistaActivo(clase, codigo, en = null, dias = 90) {
  const e = TODOS.find((x) => x.clase === clase && x.codigo === codigo);
  if (!e) { if (!en) location.hash = ''; return; }
  if (!en) app.innerHTML = '';
  const volver = document.createElement('a');
  volver.className = 'volver'; volver.href = origenLista; volver.textContent = 'volver';
  // «Volver» no toca la búsqueda: ruta() recupera el lugar guardado de la lista.

  const ficha = document.createElement('div');
  ficha.className = 'ficha';
  const h1 = document.createElement(en ? 'h2' : 'h1');
  h1.innerHTML = '<span class="cod"></span> <span class="nom"></span>';
  h1.querySelector('.cod').textContent = e.codigo;
  h1.querySelector('.nom').textContent = e.nombre;
  if (en) { // prototipo: el tipo (empresa, fondo o cripto) va pegado al nombre
    const t = clase === 'cripto' ? 'Cripto' : (e.tipo || 'Stock'), tt = /^fondo ETF/i.test(t) ? 'Fondo ETF' : t.charAt(0).toUpperCase() + t.slice(1);
    h1.append(' ', Object.assign(document.createElement('span'), { className: 'tipo-activo', textContent: '· ' + tt }));
    h1.querySelector('.tipo-activo').style.cssText = 'font-size:.55em;opacity:.85;white-space:nowrap';
  }
  ficha.appendChild(h1);
  if (e.lectura) {
    const p = document.createElement('p');
    p.className = 'lectura'; p.textContent = en ? e.lectura + (e.traduccion ? ' · ' + e.traduccion : '') : 'se lee: ' + e.lectura + (e.traduccion ? ' · significa: ' + e.traduccion : '');
    ficha.appendChild(p);
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  // Sin línea de tipo de activo (decisión del usuario, 22-nov-2026): la ficha va directo
  // del título a los enlaces; el tipo sigue en los datos, ya no se muestra.
  if (clase === 'stock') {
    const enlacesMeta = [];
    // Orden acordado (22-nov-2026): Gobierno de primero (sus registros ante la SEC),
    // luego Stock Analysis, TipRanks, TradingView y Binance, y Oficial de último (su web).
    if (e.edgar) enlacesMeta.push(['Gobierno ↗', e.edgar]);
    for (const par of fichasExternas(e)) enlacesMeta.push(par);
    if (e.web) enlacesMeta.push(['Oficial ↗', e.web]);
    for (const [rotulo, destino] of enlacesMeta) {
      const a = document.createElement('a');
      a.href = destino; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = rotulo;
      meta.appendChild(a);
    }
  }
  ficha.appendChild(meta);

  const caja = document.createElement('div');
  caja.className = 'lienzo-caja';
  const estado = document.createElement('p');
  estado.className = 'estado'; estado.textContent = 'Trayendo los registros…';
  const pie = document.createElement('div');
  pie.className = 'pie-grafica';

  if (en) en.append(ficha, caja, pie); else app.append(volver, ficha, caja, pie);
  caja.appendChild(estado);

  cargarRegistros(e).then((filas) => {
    estado.remove();
    if (filas.length < 2) {
      caja.innerHTML = '<p class="estado">Todavía no hay suficientes días registrados para dibujar.</p>';
      return;
    }
    if (!caja.isConnected) return;
    // Vista: la ventana común de 90 días de visor-rachas.mjs, la misma regla para todos los activos.
    // Los registros no se tocan: solo cambia qué tramo se dibuja. Un activo con menos historia
    // muestra la que tiene, sin marcas ni excepciones.
    const { inicio, fin } = ventanaDelDia(dias);
    const filasVentana = filas.filter((r) => r[0] >= inicio && r[0] <= fin);
    const hayMas = filasVentana.length >= 2 && filasVentana.length < filas.length;
    const info = [e.nombre, e.tipo].filter(Boolean).join(' · ');
    let d, subtitulo, uf, fecha, pieDatos, notaBase;
    const usar = (elegidas, completo) => {
      d = preparar(elegidas);
      subtitulo = `${info ? info + ' · ' : ''}Grosor = volumen/precio · ${d.rs.length} días`;
      uf = new Date(d.ultima);
      fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;
      pieDatos = `Datos al ${fecha} (UTC) · escala ±`;
      notaBase = `Trazada en vivo desde los registros publicados · datos al ${fecha} (UTC)`;
    };
    usar(hayMas ? filasVentana : filas, !hayMas);
    graficador(caja, pie, {
      total: () => d.rs.length,
      escalas: { valores: [5] },
      dibujar: (destino, geometria, hasta, limite) => {
        if (geometria.vertical) radiografiaVertical(destino, d, e.codigo, subtitulo, hasta, limite, geometria.alto);
        else radiografia(destino, d, e.codigo, subtitulo, hasta, limite);
        if (hasta === undefined || hasta >= d.rs.length) {
          destino.fillStyle = BG;
          destino.fillRect(0, geometria.alto - 28, geometria.ancho, 28);
          destino.fillStyle = TICK; destino.textAlign = 'center'; destino.textBaseline = 'middle';
          destino.font = (geometria.vertical ? '18px ' : '13px ') + FUENTE;
          destino.fillText(pieDatos + limite + '%', geometria.ancho / 2, geometria.alto - 13);
        }
      },
      codigo: e.codigo,
      fecha: () => uf,
    });
    const nota = document.createElement('span');
    nota.className = 'nota';
    nota.textContent = notaBase;
    pie.append(nota);

  }).catch((err) => {
    estado.textContent = 'No pude traer los registros de este activo (' + err.message + ').';
  });
}

  actualizarCapitalizacion = () => {

// Campaña 90d: listas del último día cerrado (4 grupos) y dos gráficas por la serie de los archivos diarios.
// Lectura: registros/categorias/serie_carrera-90d (la junta app/modulos/campana-serie.mjs) y el último día.
const campanaDatos={};
async function cargarCampana(n){
  if(campanaDatos[n])return campanaDatos[n];
  const base='registros/categorias/';
  const leer=async n=>{const r=await fetch(base+n,{cache:'no-cache'});if(!r.ok)throw Error('No se pudo leer '+n);return r.json();};
  const s=await leer(`serie_carrera-${n}d`),u=await leer(s.ultimo);

}

  return d;

function graficaEspaguetis(caja,s,seleccion,alElegir,limpio=false){

  }
