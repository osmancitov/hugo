<style>
/* Visualizador de Hugo — pelado hasta el hueso */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --tinta: #080604;
  --panel: #131722;
  --borde: #2a3140;
  --oro: #c2a15a;
  --texto: #e8eaed;
  --tenue: #9aa0ac;
}
html { background: var(--tinta); }
body {
  background: var(--tinta);
  color: var(--texto);
  font-family: 'Lora', Georgia, serif;
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.2rem 1rem 3rem;
}
h1, h2, h3 { font-family: 'Cinzel', 'Lora', serif; font-weight: 600; }
a { color: var(--oro); text-decoration: none; }
a:hover { text-decoration: underline; }

.cabecera { border-bottom: 1px solid var(--oro); padding-bottom: .6rem; margin-bottom: 1rem; }
.cabecera h1 { font-size: 1.35rem; letter-spacing: .04em; }
.cabecera p { color: var(--tenue); font-size: .85rem; margin-top: .15rem; }

#buscar {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--borde);
  color: var(--texto);
  font-family: inherit;
  font-size: 1rem;
  padding: .55rem .7rem;
  border-radius: 4px;
  margin-bottom: 1.1rem;
}
#buscar:focus { outline: 1px solid var(--oro); }

.nodo { border-bottom: 1px solid var(--borde); }
.nodo > .nodo-tit {
  display: flex; align-items: baseline; gap: .6rem;
  width: 100%; background: none; border: none; color: var(--texto);
  font-family: 'Cinzel', 'Lora', serif; font-size: 1.05rem;
  padding: .8rem .2rem; cursor: pointer; text-align: left;
}
.nodo > .nodo-tit .cuenta { color: var(--tenue); font-size: .8rem; font-family: 'Lora', serif; margin-left: auto; }
.nodo > .nodo-tit::before { content: '▸ '; color: var(--oro); }
.nodo.abierto > .nodo-tit::before { content: '▾ '; }
.nodo .hijos { display: none; padding: 0 0 .6rem 1.2rem; }
.nodo.abierto > .hijos { display: block; }

.activo-fila {
  display: flex; gap: .6rem; align-items: baseline;
  padding: .34rem .2rem; border-radius: 3px; color: var(--texto);
}
a.activo-fila:hover { background: var(--panel); text-decoration: none; }
.activo-fila .cod { font-weight: 700; min-width: 7.5em; }
.activo-fila .nom { color: var(--tenue); font-size: .9rem; }
.activo-fila .cap { color: var(--oro); font-size: .82rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.activo-fila .tipo { margin-left: auto; color: var(--oro); font-size: .75rem; white-space: nowrap; }
.vacio { color: var(--tenue); padding: .5rem .2rem; font-style: italic; }

.volver { display: inline-block; margin-bottom: .8rem; font-size: .9rem; }
.ficha { border-bottom: 1px solid var(--oro); padding-bottom: .7rem; margin-bottom: 1rem; }
.ficha h1 { font-size: 1.5rem; display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
.ficha h1 .nom { font-family: 'Lora', serif; font-size: 1rem; color: var(--tenue); font-weight: 400; }
.ficha .meta { color: var(--tenue); font-size: .88rem; margin-top: .3rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.ficha .meta .tipo { color: var(--oro); }
.ficha .lectura { color: var(--tenue); font-size: .9rem; margin-top: .15rem; font-style: italic; }

.lienzo-caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 4px; padding: .4rem; overflow-x: auto; }
canvas { display: block; width: 100%; height: auto; }
.pie-grafica { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: .6rem; flex-wrap: wrap; }
.pie-grafica .nota { color: var(--tenue); font-size: .8rem; font-style: italic; }
button.boton {
  background: none; border: 1px solid var(--oro); color: var(--oro);
  font-family: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 3px; cursor: pointer;
}
button.boton:hover { background: var(--oro); color: var(--tinta); }
.nav-activo { display: flex; justify-content: space-between; margin-bottom: .8rem; font-size: .9rem; }
.estado { color: var(--tenue); padding: 2rem 0; text-align: center; font-style: italic; }

.tit-fila { display: flex; align-items: center; gap: .65rem; }
.avatar { width: 44px; height: 44px; border-radius: 5px; border: 1px solid var(--borde); display: block; }

.activo-fila .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 0; }
.caps { margin-left: auto; display: flex; gap: 1rem; flex: none; }
.cap-sub { min-width: 5.2em; text-align: right; color: var(--tenue); font-size: .82rem; font-variant-numeric: tabular-nums; }
.caps .cap { margin-left: 0; min-width: 3.8em; text-align: right; }
.fila-cab { display: flex; align-items: baseline; gap: .8rem; padding: .15rem .2rem .4rem; border-bottom: 1px solid var(--borde); margin-bottom: .2rem; }
.nota-caps { color: var(--tenue); font-size: .72rem; font-style: italic; line-height: 1.35; }
.lab-cols { margin-left: auto; display: flex; gap: 1rem; flex: none; }
.lab-cols span { font-size: .72rem; letter-spacing: .05em; }
.lab-sub { min-width: 5.2em; text-align: right; color: var(--tenue); }
.lab-cap { min-width: 3.8em; text-align: right; color: var(--oro); }

</style>
</head>

<script>
/* Visualizador de Hugo: árbol de activos + radiografía trazada en vivo desde los registros. */
'use strict';

const RAW = 'https://raw.githubusercontent.com/osmancitov/hugo/main/registros/velas-24h';
const MESES_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MESES_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const BG = '#131722', BLUE = '#5a92d6', TICK = '#c9ccd3';
const GRID_D = '#212835', GRID_15 = '#313b50', GRID_1 = '#3d4759', ZERO = '#8b93a1';
const GREEN = 'rgba(37,133,92,0.5)', RED = 'rgba(183,61,64,0.5)';
const GREEN_S = 'rgb(37,133,92)', RED_S = 'rgb(183,61,64)';
const MARCO = '#3d4759';
const FUENTE = '"DejaVu Sans","Noto Sans CJK SC","Noto Sans CJK TC","WenQuanYi Zen Hei",sans-serif';

const YLO = -15, YHI = 15, TLO = -14, THI = 14;
const LW = 1516, LH = 758, ML = 80, MR = 27, MT = 57, MB = 36;
const PW = LW - ML - MR, PH = LH - MT - MB;

const $ = (sel) => document.querySelector(sel);
const app = $('#app');

/* ---------- catálogo ---------- */
const TODOS = [];
const CRIPTOS = CATALOGO.cripto.map((e) => ({ ...e, clase: 'cripto' }));
const STOCKS = CATALOGO.stock.map((e) => ({ ...e, clase: 'stock' }));
for (const e of CRIPTOS) TODOS.push(e);
for (const e of STOCKS) TODOS.push(e);
const EMPRESAS = STOCKS.filter((e) => e.tipo === 'empresa').sort((a, b) => (b.cap || 0) - (a.cap || 0));
const FONDOS = STOCKS.filter((e) => e.tipo !== 'empresa').sort((a, b) => (b.cap || 0) - (a.cap || 0));

function fmtCap(v) {
  if (v >= 1e12) return (v / 1e12).toFixed(2).replace('.', ',') + ' B';
  if (v >= 1e9) return (v / 1e9).toFixed(1).replace('.', ',') + ' MM';
  if (v >= 1e7) return Math.round(v / 1e6) + ' M';
  return (v / 1e6).toFixed(1).replace('.', ',') + ' M';
}

function filaActivo(e, conCap) {
  const a = document.createElement('a');
  a.className = 'activo-fila';
  a.href = '#/a/' + e.clase + '/' + encodeURIComponent(e.codigo);
  const lectura = e.lectura ? ` · ${e.lectura}` : '';
  const der = conCap && e.cap ? 'caps' : (e.tipo ? 'tipo' : '');
  a.innerHTML = `<span class="cod"></span><span class="nom"></span>` +
    (der === 'caps' ? '<span class="caps"><span class="cap-sub"></span><span class="cap"></span></span>'
      : der ? '<span class="tipo"></span>' : '');
  a.querySelector('.cod').textContent = e.codigo;
  a.querySelector('.nom').textContent = e.nombre + lectura;
  if (der === 'caps') {
    a.querySelector('.cap-sub').textContent = e.cap_sub ? fmtCap(e.cap_sub) : '—';
    a.querySelector('.cap').textContent = fmtCap(e.cap);
  } else if (der === 'tipo') a.querySelector('.tipo').textContent = e.tipo;
  return a;
}

function cabCaps() {
  const d = document.createElement('div');
  d.className = 'fila-cab';
  d.innerHTML = '<span class="nota-caps"></span><span class="lab-cols"><span class="lab-sub">Base</span><span class="lab-cap">Token</span></span>';
  d.querySelector('.nota-caps').textContent =
    'Base: capitalización del activo subyacente en bolsa, al cierre del 13-nov-2026 · Token: capitalización de la ficha bStock, al 16-nov-2026';
  return d;
}

function nodoArbol(titulo, cuenta, lista, conCap) {
  const n = document.createElement('div');
  n.className = 'nodo';
  const b = document.createElement('button');
  b.className = 'nodo-tit';
  b.innerHTML = `<span></span><span class="cuenta"></span>`;
  b.querySelector('span').textContent = titulo;
  b.querySelector('.cuenta').textContent = cuenta;
  b.addEventListener('click', () => n.classList.toggle('abierto'));
  const h = document.createElement('div');
  h.className = 'hijos';
  for (const e of lista) h.appendChild(filaActivo(e, conCap));
  if (!lista.length) h.innerHTML = '<p class="vacio">Vacío por ahora.</p>';
  n.append(b, h);
  return n;
}

function vistaArbol(q) {
  app.innerHTML = '';
  if (q) {
    const s = q.toLowerCase();
    const hall = TODOS.filter((e) =>
      e.codigo.toLowerCase().includes(s) || (e.nombre || '').toLowerCase().includes(s) ||
      (e.lectura || '').toLowerCase().includes(s));
    const caja = document.createElement('div');
    if (!hall.length) caja.innerHTML = '<p class="vacio">Nada coincide con esa búsqueda.</p>';
    for (const e of hall) caja.appendChild(filaActivo(e));
    app.appendChild(caja);
    return;
  }
  const nStocks = nodoArbol('Stocks', STOCKS.length + ' activos', []);
  const hijos = nStocks.querySelector('.hijos');
  hijos.innerHTML = '';
  const nEmp = nodoArbol('Empresas', EMPRESAS.length + ' activos', EMPRESAS, true);
  nEmp.querySelector('.hijos').prepend(cabCaps());
  const nFon = nodoArbol('Fondos', FONDOS.length + ' activos', FONDOS, true);
  nFon.querySelector('.hijos').prepend(cabCaps());
  hijos.appendChild(nEmp);
  hijos.appendChild(nFon);
  app.appendChild(nStocks);
  app.appendChild(nodoArbol('Cripto', CRIPTOS.length + ' activos', CRIPTOS));
}

/* ---------- datos ---------- */
const cacheRegistros = new Map();
async function cargarRegistros(e) {
  const clave = e.clase + '/' + e.codigo;
  if (cacheRegistros.has(clave)) return cacheRegistros.get(clave);
  const cod = encodeURIComponent(e.codigo);
  const respuestas = await Promise.all(e.meses.map((m) =>
    fetch(`${RAW}/${e.clase}/${cod}/${m}_${cod}`).then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' en ' + m);
      return r.json();
    })));
  const filas = respuestas.flat().sort((a, b) => a[0] - b[0]);
  cacheRegistros.set(clave, filas);
  return filas;
}

/* ---------- radiografía (port fiel del productor) ---------- */
function mediana(xs) {
  const s = [...xs].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
const miles = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function preparar(filas) {
  const ohlc4 = filas.map((r) => (+r[1] + +r[2] + +r[3] + +r[4]) / 4);
  const vol = filas.map((r) => +r[5]);
  const fechas = filas.map((r) => new Date(r[0]));
  const rets = [];
  for (let i = 1; i < ohlc4.length; i++) rets.push((ohlc4[i] / ohlc4[i - 1] - 1) * 100);
  const rs = [0, ...rets];
  const vp = vol.map((v, i) => v / ohlc4[i]);
  const vmin = Math.min(...vp), vmax = Math.max(...vp);
  const vmed = mediana(vp);
  const pos = rets.filter((r) => r > 0), neg = rets.filter((r) => r < 0);
  return {
    fechas, rs, vp, vmin, vmax, vmed,
    asum: pos.reduce((a, b) => a + b, 0), ansum: neg.reduce((a, b) => a + b, 0),
    dpos: pos.length, dneg: neg.length,
    ultima: filas[filas.length - 1][6],
  };
}

function lienzo(caja) {
  const dpr = window.devicePixelRatio || 1;
  const ancho = caja.clientWidth - 16;
  // en pantallas angostas el lienzo no baja de 940 CSS px: se desplaza en vez de volverse ilegible
  const cssW = ancho < 940 ? 940 : Math.min(ancho, LW);
  const escala = cssW / LW;
  const cv = document.createElement('canvas');
  cv.width = Math.round(LW * escala * dpr);
  cv.height = Math.round(LH * escala * dpr);
  cv.style.width = Math.round(LW * escala) + 'px';
  cv.style.height = Math.round(LH * escala) + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(escala * dpr, escala * dpr);
  caja.appendChild(cv);
  return ctx;
}

function radiografia(ctx, d, codigo, subtitulo, hasta) {
  const npts = d.rs.length;
  const X = (i) => ML + (i / (npts - 1)) * PW;
  const Y = (v) => MT + ((YHI - v) / (YHI - YLO)) * PH;

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, LW, LH);

  // rejilla
  ctx.lineWidth = 0.72;
  for (let i = 0; i < npts; i++) {
    const dia = d.fechas[i].getUTCDate();
    ctx.strokeStyle = dia === 1 ? GRID_1 : dia === 15 ? GRID_15 : GRID_D;
    ctx.lineWidth = dia === 1 || dia === 15 ? 1.44 : 0.72;
    ctx.beginPath(); ctx.moveTo(X(i), MT); ctx.lineTo(X(i), MT + PH); ctx.stroke();
  }
  ctx.strokeStyle = GRID_D; ctx.lineWidth = 0.72;
  for (let v = TLO; v <= THI; v += 2) {
    ctx.beginPath(); ctx.moveTo(ML, Y(v)); ctx.lineTo(ML + PW, Y(v)); ctx.stroke();
  }
  ctx.strokeStyle = MARCO; ctx.lineWidth = 1.44;
  for (const v of [YLO, YHI]) {
    ctx.beginPath(); ctx.moveTo(ML, Y(v)); ctx.lineTo(ML + PW, Y(v)); ctx.stroke();
  }

  // ejes
  ctx.fillStyle = TICK;
  ctx.font = '10.5px ' + FUENTE;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const marcas = [YLO]; for (let v = TLO; v <= THI; v += 2) marcas.push(v); marcas.push(YHI);
  for (const v of marcas) ctx.fillText(v + '%', ML - 8, Y(v));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i < npts; i++) {
    const f = d.fechas[i], dia = f.getUTCDate();
    if (dia === 1 || dia === 15)
      ctx.fillText(`${String(dia).padStart(2, '0')} ${MESES_EN[f.getUTCMonth()]}`, X(i), MT + PH + 8);
  }
  ctx.save();
  ctx.translate(20, MT + PH / 2); ctx.rotate(-Math.PI / 2);
  ctx.font = '12px ' + FUENTE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Variación diaria', 0, 0);
  ctx.restore();

  // títulos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8eaed'; ctx.font = '14px ' + FUENTE;
  ctx.fillText(`${codigo} variación diaria`, LW / 2, 15);
  ctx.fillStyle = '#9aa0ac'; ctx.font = '11px ' + FUENTE;
  ctx.fillText(subtitulo, LW / 2, 40);

  const fin = hasta === undefined ? npts : hasta;

  // áreas, cero y línea van recortadas al marco (matplotlib recorta las colecciones al axes)
  ctx.save();
  ctx.beginPath(); ctx.rect(ML, MT, PW, PH); ctx.clip();

  // áreas
  for (let i = 1; i < fin; i++) {
    const r = d.rs[i];
    if (r === 0) continue;
    ctx.fillStyle = r > 0 ? GREEN : RED;
    ctx.beginPath();
    ctx.moveTo(X(i - 1), Y(0)); ctx.lineTo(X(i - 1), Y(r));
    ctx.lineTo(X(i), Y(r)); ctx.lineTo(X(i), Y(0));
    ctx.closePath(); ctx.fill();
  }

  // línea cero
  ctx.strokeStyle = ZERO; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(ML, Y(0)); ctx.lineTo(ML + PW, Y(0)); ctx.stroke();

  // línea v/p con grosor
  const wpix = (v) => d.vmax > d.vmin
    ? Math.max(0.7, Math.min(12, 0.7 + ((v - d.vmin) / (d.vmax - d.vmin)) * 11.3)) : 0.7;
  ctx.strokeStyle = BLUE; ctx.globalAlpha = 0.9;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < fin; i++) {
    ctx.lineWidth = wpix(d.vp[i]) * 0.72;
    ctx.beginPath(); ctx.moveTo(X(i - 1), Y(d.rs[i - 1])); ctx.lineTo(X(i), Y(d.rs[i])); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (fin < npts) return null; // animación en curso: sin marcas ni leyenda todavía

  // leyenda (primero medimos para que las marcas la esquiven)
  const lineas = [
    { tipo: 'lin', w: 0.7 * 0.72, txt: `mín ${Math.round(d.vmin)} v/p` },
    { tipo: 'lin', w: wpix(d.vmed) * 0.72, txt: `med ${Math.round(d.vmed)} v/p` },
    { tipo: 'lin', w: 12 * 0.72, txt: `máx ${miles(d.vmax)} v/p` },
    { tipo: 'parche', c: GREEN, txt: `+${Math.round(d.asum)} %d / ${d.dpos} d` },
    { tipo: 'parche', c: RED, txt: `−${Math.round(Math.abs(d.ansum))} %d / ${d.dneg} d` },
  ];
  if (d.ansum !== 0 && d.dneg > 0)
    lineas.push({ tipo: 'flag', txt: `${(d.asum / Math.abs(d.ansum)).toFixed(2)} / ${(d.dpos / d.dneg).toFixed(2)}` });
  ctx.font = '10px ' + FUENTE;
  let anchoTxt = 0;
  for (const l of lineas) anchoTxt = Math.max(anchoTxt, ctx.measureText(l.txt).width);
  const legW = anchoTxt + 46, legH = lineas.length * 15 + 8;
  const legX = ML + PW - legW - 4, legY = MT + 4;

  // marcas fuera del marco
  const filasTxt = [];
  const ultimoX = () => (filasTxt.length ? filasTxt[filasTxt.length - 1][0] : null);
  for (let i = 1; i < npts; i++) {
    const r = d.rs[i];
    if (Math.abs(r) <= YHI) continue;
    const arriba = r > 0, ym = arriba ? YHI : YLO;
    ctx.fillStyle = arriba ? GREEN_S : RED_S; ctx.globalAlpha = 0.9;
    ctx.beginPath();
    if (arriba) { ctx.moveTo(X(i), Y(ym) - 6); ctx.lineTo(X(i) - 5.5, Y(ym) + 6); ctx.lineTo(X(i) + 5.5, Y(ym) + 6); }
    else { ctx.moveTo(X(i), Y(ym) + 6); ctx.lineTo(X(i) - 5.5, Y(ym) - 6); ctx.lineTo(X(i) + 5.5, Y(ym) - 6); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

    const pi = d.rs[i - 1] ?? 0, si = d.rs[i + 1] ?? 0;
    const pref = Math.abs(si - r) > Math.abs(pi - r) ? -1.8 : 1.8;
    let iTxt = i + pref;
    const ult = ultimoX();
    for (const cand of [pref, 0, -pref]) {
      if (ult === null || i + cand > ult + 0.8) { iTxt = i + cand; break; }
    }
    let fila = 0;
    for (const [xp, fp] of filasTxt) if (Math.abs(xp - iTxt) < 6 && fp === fila) fila++;
    // esquivar la leyenda, medido en coordenadas de datos como el productor
    const invX = (px) => ((px - ML) / PW) * (npts - 1);
    const invY = (px) => YHI - ((px - MT) / PH) * (YHI - YLO);
    const bb = { x0: invX(legX), x1: invX(legX + legW), y0: invY(legY + legH) };
    const medio = 23.0 * npts / 1409.0; // semiancho estimado de una etiqueta, en días
    if (arriba) {
      while (iTxt + medio > bb.x0 && iTxt - medio < bb.x1 &&
             ym - (1.6 + fila * 2.1) > bb.y0) fila++;
    }
    filasTxt.push([iTxt, fila]);
    const paso = 2.1;
    const yt = arriba ? ym - (1.6 + fila * paso) : ym + (1.2 + fila * paso);
    const yc0 = arriba ? ym - 0.6 : ym + 0.6;
    const yc1 = arriba ? yt + 0.15 : yt - 0.15;
    ctx.strokeStyle = TICK; ctx.globalAlpha = 0.45; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(X(i), Y(yc0)); ctx.lineTo(X(iTxt), Y(yc1)); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = '8px ' + FUENTE;
    ctx.textAlign = 'center'; ctx.textBaseline = arriba ? 'top' : 'bottom';
    ctx.lineWidth = 2.5; ctx.strokeStyle = BG;
    const txt = (arriba ? '+' : '−') + Math.abs(r).toFixed(1) + ' %';
    ctx.strokeText(txt, X(iTxt), Y(yt));
    ctx.fillStyle = TICK;
    ctx.fillText(txt, X(iTxt), Y(yt));
  }

  // leyenda encima de todo
  ctx.fillStyle = '#161a25'; ctx.strokeStyle = '#1a1e2a';
  ctx.beginPath(); ctx.rect(legX, legY, legW, legH); ctx.fill(); ctx.stroke();
  ctx.font = '10px ' + FUENTE;
  lineas.forEach((l, k) => {
    const y = legY + 11 + k * 15;
    if (l.tipo === 'lin') {
      ctx.strokeStyle = BLUE; ctx.globalAlpha = 0.9; ctx.lineWidth = Math.max(0.5, l.w);
      ctx.beginPath(); ctx.moveTo(legX + 8, y - 3); ctx.lineTo(legX + 26, y - 3); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (l.tipo === 'parche') {
      ctx.fillStyle = l.c; ctx.fillRect(legX + 8, y - 8, 18, 10);
    } else {
      ctx.fillStyle = GREEN;
      ctx.beginPath(); ctx.moveTo(legX + 8, y - 8); ctx.lineTo(legX + 8, y + 2); ctx.lineTo(legX + 17, y - 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = RED;
      ctx.beginPath(); ctx.moveTo(legX + 17, y + 2); ctx.lineTo(legX + 26, y + 2); ctx.lineTo(legX + 26, y - 8); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = TICK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(l.txt, legX + 32, y - 3);
  });
}

/* ---------- vista de activo ---------- */
function vistaActivo(clase, codigo) {
  const e = TODOS.find((x) => x.clase === clase && x.codigo === codigo);
  if (!e) { location.hash = ''; return; }
  const lista = clase === 'cripto' ? CRIPTOS : STOCKS;
  const pos = lista.findIndex((x) => x.codigo === codigo);
  const ant = lista[pos - 1], sig = lista[pos + 1];

  app.innerHTML = '';
  const nav = document.createElement('div');
  nav.className = 'nav-activo';
  const enlace = (x, txt) => x
    ? `<a href="#/a/${x.clase}/${encodeURIComponent(x.codigo)}">${txt}</a>` : '<span></span>';
  nav.innerHTML = enlace(ant, '← ' + (ant ? ant.codigo : '')) + enlace(sig, (sig ? sig.codigo : '') + ' →');
  const volver = document.createElement('a');
  volver.className = 'volver'; volver.href = '#/'; volver.textContent = 'volver';

  const ficha = document.createElement('div');
  ficha.className = 'ficha';
  const h1 = document.createElement('h1');
  h1.innerHTML = '<span class="cod"></span> <span class="nom"></span>';
  h1.querySelector('.cod').textContent = e.codigo;
  h1.querySelector('.nom').textContent = e.nombre;
  ficha.appendChild(h1);
  if (e.lectura) {
    const p = document.createElement('p');
    p.className = 'lectura'; p.textContent = 'se lee: ' + e.lectura;
    ficha.appendChild(p);
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  const bits = [];
  if (e.tipo) bits.push(`<span class="tipo"></span>`);
  bits.push(`<span>${clase === 'cripto' ? 'cripto' : 'stock'} · ${e.meses.length} ${e.meses.length === 1 ? 'mes' : 'meses'} registrados</span>`);
  meta.innerHTML = bits.join('');
  if (e.tipo) meta.querySelector('.tipo').textContent = e.tipo;
  if (e.edgar) {
    const a = document.createElement('a');
    a.href = e.edgar; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Ficha ↗';
    meta.appendChild(a);
  }
  ficha.appendChild(meta);

  const caja = document.createElement('div');
  caja.className = 'lienzo-caja';
  const estado = document.createElement('p');
  estado.className = 'estado'; estado.textContent = 'Trayendo los registros…';
  const pie = document.createElement('div');
  pie.className = 'pie-grafica';

  app.append(nav, volver, ficha, caja, pie);
  caja.appendChild(estado);

  cargarRegistros(e).then((filas) => {
    estado.remove();
    if (filas.length < 2) {
      caja.innerHTML = '<p class="estado">Todavía no hay suficientes días registrados para dibujar.</p>';
      return;
    }
    const d = preparar(filas);
    const ctx = lienzo(caja);
    const info = [e.nombre, e.tipo].filter(Boolean).join(' · ');
    const subtitulo = `${info ? info + ' · ' : ''}Grosor = volumen/precio · ${d.rs.length - 1} días`;
    const uf = new Date(d.ultima);
    const fecha = `${uf.getUTCDate()} ${MESES_ES[uf.getUTCMonth()]} ${uf.getUTCFullYear()}`;

    const sinMovimiento = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let animId = null;
    const dibujarTodo = () => radiografia(ctx, d, e.codigo, subtitulo);
    const trazar = () => {
      if (animId) cancelAnimationFrame(animId);
      if (sinMovimiento) { dibujarTodo(); return; }
      const t0 = performance.now();
      const paso = (t) => {
        const p = Math.min(1, (t - t0) / 2000);
        const k = 1 + Math.floor(p * (d.rs.length - 1));
        if (p < 1) { radiografia(ctx, d, e.codigo, subtitulo, k); animId = requestAnimationFrame(paso); }
        else { dibujarTodo(); animId = null; }
      };
      animId = requestAnimationFrame(paso);
    };
    trazar();

    const btn = document.createElement('button');
    btn.className = 'boton'; btn.textContent = 'Repetir trazado';
    btn.addEventListener('click', trazar);
    const nota = document.createElement('span');
    nota.className = 'nota';
    nota.textContent = `Trazada en vivo desde los registros publicados · datos al ${fecha} (UTC)`;
    pie.append(btn, nota);
  }).catch((err) => {
    estado.textContent = 'No pude traer los registros de este activo (' + err.message + ').';
  });
}

/* ---------- arranque ---------- */
function ruta() {
  const m = location.hash.match(/^#\/a\/(cripto|stock)\/(.+)$/);
  if (m) vistaActivo(m[1], decodeURIComponent(m[2]));
  else vistaArbol($('#buscar').value.trim());
}
$('#buscar').addEventListener('input', ruta);
window.addEventListener('hashchange', ruta);
ruta();

</script>
