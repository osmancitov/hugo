# Lectura horaria de Hugo mientras la Debian está apagada. Gratuita en este
# repositorio público (ejecutores estándar). GitHub puede demorar o descartar
# una corrida programada; la lectura guarda su hora real, nunca una forzada.
# Frontera con la Debian: si el repositorio ya trae una lectura de esa hora, la
# corrida no toma otra. El reloj de Google despacha este workflow; no hay cron
# de respaldo en GitHub. Se conserva siempre el instante real de la lectura.
name: Lectura horaria de Hugo

on:
  workflow_dispatch:
    inputs:
      intrahora:
        description: 'Toma la lectura ya, con su instante real, aunque la hora ya tenga lectura (prueba manual autorizada)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lectura-horaria
  cancel-in-progress: false

jobs:
  lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22, como la Debian
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restaurar cola y pausa de corridas anteriores
        uses: actions/cache/restore@v4
        with:
          path: .estado-intradia
          key: intradia-estado-${{ github.run_id }}
          restore-keys: intradia-estado-
      - name: Tomar la lectura (o saltarla si hay una de esa hora)
        id: lectura
        env:
          HUGO_HORARIA_MANUAL: ${{ github.event.inputs.intrahora || '' }}
        run: node .github/lectura-horaria.mjs
      - name: Publicar en el repositorio
        if: steps.lectura.outputs.cambios == 'si'
        env:
          HUGO_HORARIA_MANUAL: ${{ github.event.inputs.intrahora || '' }}
        run: |
          set -e
          git config user.name Osmancito
          git config user.email osmanvielma@gmail.com
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard origin/main
            node .github/recombinar-horaria.mjs
            git add registros/
            if git diff --cached --quiet; then
              echo "Sin cambios que publicar; el remoto ya cubre la cola."
              exit 0
            fi
            git commit -m "Guardar lectura horaria de las $(date -u +'%H:%M') UTC desde Actions"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "El remoto avanzó durante el intento $i; recombinando la cola antes de reintentar."
            sleep $((i * 10))
          done
          echo "GitHub siguió avanzando durante los reintentos; la cola queda pendiente."
          exit 1
      - name: Confirmar la cola publicada
        if: steps.lectura.outputs.cambios == 'si'
        run: node .github/confirmar-horaria.mjs
      - name: Guardar cola y pausa para la próxima corrida
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .estado-intradia
          key: intradia-estado-${{ github.run_id }}

  # Cripto (25-nov-2026): trabajo aparte del de stocks, con su propio commit. Si falla, la lectura
  # de stocks no se ve afectada. Solo escribe registros/intradia/cripto.
  cripto:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    continue-on-error: true
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22, como la Debian
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tomar la lectura de cripto
        if: ${{ github.event.inputs.intrahora != 'true' }}
        run: node .github/lectura-horaria-cripto.mjs
      - name: Publicar la lectura de cripto
        if: ${{ github.event.inputs.intrahora != 'true' }}
        run: |
          git config user.name Osmancito
          git config user.email osmanvielma@gmail.com
          git add registros/intradia/cripto
          if git diff --cached --quiet; then echo "Sin lectura de cripto que publicar."; exit 0; fi
          git commit -m "Guardar lectura horaria de cripto de las $(date -u +'%H:%M') UTC desde Actions"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --quiet origin main
            sleep $((i * 5))
          done
          echo "No pude publicar la lectura de cripto."; exit 1
