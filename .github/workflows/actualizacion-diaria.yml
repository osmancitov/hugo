# Puesta al día diaria de Hugo desde la nube (decisión del usuario, 22-nov-2026): Google Apps
# Script dispara el flujo entre las 00:05 y las 00:14 UTC, con la vela diaria ya cerrada y
# asentada; el cron queda de respaldo hacia la 01:00 UTC por si el disparador falta (una
# corrida programada puede demorarse o descartarse). Idempotente por contenido: si el día ya
# está cubierto y publicado, la corrida no cambia nada; si hubo noches sin correr, la corrida
# alcanza los días pendientes. El aviso de inicio y resultado llega a Slack por la app oficial
# de GitHub. No toca la lectura horaria ni el bot de la Debian.
name: Puesta al día diaria de Hugo

on:
  schedule:
    - cron: '58 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  diaria:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Node 22, como la Debian
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poner los registros al día y publicar
        env:
          HUGO_GH_KEY: ${{ secrets.GITHUB_TOKEN }}
          HUGO_GITHUB: osmancitov/hugo
        run: node .github/actualizacion-diaria.mjs
