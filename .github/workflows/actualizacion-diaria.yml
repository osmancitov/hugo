# Puesta al día diaria de Hugo desde la nube (decisión del usuario, 22-nov-2026): Google Apps
# Script disparará el flujo entre las 00:05 y las 00:14 UTC, con la vela diaria ya cerrada y
# asentada. Mientras la diaria automática de la Debian siga activa, el flujo SOLO corre a mano
# (workflow_dispatch): sin cron, para no duplicar responsabilidad. Al confirmar la pausa de la
# Debian se activa el disparo de Google y, si se quiere, un cron de respaldo. Idempotente por
# contenido: si el día ya está cubierto y publicado, la corrida no cambia nada; si hubo noches
# sin correr, la corrida alcanza los días pendientes. El aviso de inicio y resultado llega a
# Slack por la app oficial de GitHub. No toca la lectura horaria ni el bot de la Debian.
name: Puesta al día diaria de Hugo

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  diaria:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Node 22, como la Debian
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poner los registros al día y publicar
        env:
          HUGO_GH_KEY: ${{ secrets.GITHUB_TOKEN }}
          HUGO_GITHUB: osmancitov/hugo
        run: node .github/actualizacion-diaria.mjs
      - name: Registrar la carrera 90d de la Campaña
        run: node .github/campana-diaria.mjs
      - name: Reconstruir el día cerrado de los VIP (registro horario canónico)
        run: node .github/canonico-diario.mjs
      - name: Publicar el visor con los registros actualizados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/publicar-visor.mjs
