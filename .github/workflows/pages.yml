# Publica el visor solo cuando cambian archivos fuera de las tomas intradiarias.
name: Visor estático de Hugo

on:
  push:
    branches: [main]
    paths-ignore:
      - 'registros/intradia/stock/**'
      - 'registros/pre-calculado/stock/barra-24h/actual_barra'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_reintento.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5
      - name: Generar entrada de superficie con Open Graph propio
        run: |
          node cuenta/generar.mjs
          node app/generar-colores-iceberg.mjs
          node app/generar-pagina-superficie.mjs
          node app/generar-rutas-mercado.mjs
      - name: Preparar Pages
        uses: actions/configure-pages@v6
      - name: Empaquetar el sitio estático
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Publicar el visor
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Esperar antes de reintentar la publicación
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Reintentar la publicación del visor
        id: deployment_reintento
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
